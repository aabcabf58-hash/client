<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item details</title>
  <style>
    :root {
      --primary: #a63a00;
      --primary-dark: #7d2b00;
      --primary-soft: #fff0e7;
      --background: #f7f8fa;
      --surface: #ffffff;
      --text: #202124;
      --muted: #6f7378;
      --border: #e6e8eb;
      --success: #087b4b;
      --success-soft: #e9f8f0;
      --danger: #b42318;
      --danger-soft: #fff0ef;
      --shadow: 0 12px 32px rgba(31, 35, 40, .08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--background);
      font-family: Inter, Arial, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    .loading {
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--primary);
      font-weight: 800;
    }

    .page {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 22px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 14px;
    }

    .topbar h1 {
      margin: 0 0 5px;
      font-size: clamp(24px, 4vw, 36px);
    }

    .topbar p {
      margin: 0;
      color: var(--muted);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .button {
      min-height: 42px;
      padding: 0 16px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      background: var(--primary);
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .button:hover {
      background: var(--primary-dark);
    }

    .button.secondary {
      color: var(--primary);
      background: var(--primary-soft);
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    .currency-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 14px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: 0 6px 20px rgba(31, 35, 40, .04);
    }

    .currency-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .currency-switch {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border-radius: 12px;
      background: #f0f1f3;
    }

    .currency-button {
      min-width: 62px;
      height: 36px;
      border: 0;
      border-radius: 9px;
      color: var(--muted);
      background: transparent;
      font-weight: 900;
      cursor: pointer;
    }

    .currency-button.active {
      color: #fff;
      background: var(--primary);
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 14px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .breadcrumb a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 800;
    }

    .error-box,
    .message {
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.45;
      font-weight: 700;
    }

    .error-box,
    .message.error {
      color: var(--danger);
      background: var(--danger-soft);
      border: 1px solid #ffc9c4;
    }

    .message.success {
      color: var(--success);
      background: var(--success-soft);
      border: 1px solid #bdebd2;
    }

    .item-card {
      display: grid;
      grid-template-columns: minmax(220px, 34%) 1fr;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .item-visual {
      min-height: 330px;
      background:
        radial-gradient(circle at 20% 20%, #ffd7bf, transparent 42%),
        linear-gradient(145deg, #fff3eb, #f4ded1);
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .item-image {
      width: min(210px, 100%);
      aspect-ratio: 1;
      object-fit: contain;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 10px 24px rgba(80, 35, 10, .12);
    }

    .item-placeholder {
      display: grid;
      place-items: center;
      color: var(--primary);
      font-size: 70px;
      font-weight: 900;
    }

    .item-content {
      padding: clamp(22px, 4vw, 40px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .item-type {
      width: max-content;
      margin-bottom: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      color: var(--primary);
      background: var(--primary-soft);
      font-size: 12px;
      font-weight: 900;
    }

    .item-name {
      margin: 0 0 8px;
      font-size: clamp(25px, 4vw, 38px);
    }

    .item-description {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.6;
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 22px;
    }

    .fact {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: #fafafa;
    }

    .fact-label {
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .fact-value {
      font-weight: 900;
      word-break: break-word;
    }

    .order-box {
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .order-box h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    .field-label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 900;
    }

    .order-input {
      width: 100%;
      min-height: 48px;
      padding: 0 14px;
      border: 1px solid #d7dade;
      border-radius: 12px;
      outline: none;
      background: #fff;
    }

    .order-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(166, 58, 0, .12);
    }

    .field-help {
      min-height: 18px;
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .price-preview {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      padding: 13px 14px;
      border-radius: 13px;
      background: #faf5f1;
    }

    .price-preview strong {
      color: var(--primary);
      font-size: 18px;
    }

    .order-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .order-actions .button {
      flex: 1;
    }

    .message {
      margin-top: 12px;
    }

    @media (max-width: 700px) {
      .page {
        width: min(100% - 20px, 960px);
        padding-top: 12px;
      }

      .topbar {
        align-items: flex-start;
      }

      .topbar p,
      .topbar h1 {
        display: none;
      }

      .topbar-actions {
        width: 100%;
      }

      .topbar-actions .button {
        flex: 1;
        min-width: 70px;
        padding: 0 10px;
      }

      .item-card {
        grid-template-columns: 1fr;
      }

      .item-visual {
        min-height: 190px;
        padding: 20px;
      }

      .item-image {
        width: 150px;
      }

      .item-content {
        padding: 20px;
      }

      .facts {
        grid-template-columns: 1fr 1fr;
      }

      .order-actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">Loading item...</div>

  <main id="page" class="page hidden">
    <header class="topbar">
      <div>
        <h1>Item details</h1>
        <p>Review the item and complete your order.</p>
      </div>

      <div class="topbar-actions">
        <a class="button secondary" href="./home.html" aria-label="Home">🏠</a>
        <button id="backButton" class="button secondary" type="button">Back</button>
        <button id="logoutButton" class="button" type="button">Logout</button>
      </div>
    </header>

    <section class="currency-toolbar" aria-label="Order currency">
      <span class="currency-label">Selected currency</span>
      <div class="currency-switch">
        <button class="currency-button" data-currency="LBP" type="button">LBP</button>
        <button class="currency-button" data-currency="USD" type="button">USD</button>
      </div>
    </section>

    <nav class="breadcrumb">
      <a href="./home.html">Categories</a>
      <span>›</span>
      <span id="categoryCrumb">Category</span>
      <span>›</span>
      <span id="subcategoryCrumb">Subcategory</span>
      <span>›</span>
      <span id="childCrumb">Service</span>
    </nav>

    <div id="pageError" class="error-box hidden"></div>

    <article id="itemCard" class="item-card hidden">
      <div id="itemVisual" class="item-visual"></div>

      <div class="item-content">
        <div id="itemTypeBadge" class="item-type">ITEM</div>
        <h2 id="itemName" class="item-name">Item</h2>
        <p id="itemDescription" class="item-description"></p>

        <div id="itemFacts" class="facts"></div>

        <section id="packageOrderBox" class="order-box hidden">
          <h2>Complete package order</h2>
          <label class="field-label" for="targetIdentifier">Target identifier</label>
          <input
            id="targetIdentifier"
            class="order-input"
            type="text"
            autocomplete="off"
            placeholder="Enter phone number or target ID"
          >
          <p class="field-help">The price is taken securely from the server.</p>
          <div class="order-actions">
            <button id="packageOrderButton" class="button" type="button">
              Create order
            </button>
          </div>
          <div id="packageMessage" class="message hidden"></div>
        </section>

        <section id="counterOrderBox" class="order-box hidden">
          <h2>Choose counter</h2>
          <label class="field-label" for="counterInput">Counter</label>
          <input
            id="counterInput"
            class="order-input"
            type="number"
            inputmode="decimal"
            autocomplete="off"
            placeholder="Enter counter"
          >
          <p id="counterHelp" class="field-help"></p>

          <div class="price-preview">
            <span>Total price</span>
            <strong id="counterTotalPrice">—</strong>
          </div>

          <div class="order-actions">
            <button id="checkPriceButton" class="button secondary" type="button">
              Check price
            </button>
            <button id="counterOrderButton" class="button" type="button">
              Create order
            </button>
          </div>
          <div id="counterMessage" class="message hidden"></div>
        </section>
      </div>
    </article>
  </main>

  <script>
    const API_BASE_URL = "https://abdd-production.up.railway.app";

    const API_PATHS = {
      ITEMS_PACKAGE: "/category/getAllItemsPackage",
      ITEMS_COUNTER: "/category/getAllItemsCounter",
      CREATE_ORDER_PACKAGE: "/orders/createOrderPackage",
      GET_COUNTER_PRICE: "/orders/getcounterprice",
      CREATE_ORDER_COUNTER: "/orders/createordercounter",
    };

    const params = new URLSearchParams(window.location.search);
    const categoryId = params.get("category_id");
    const categoryName = params.get("category_name") || "Category";
    const subcategoryId = params.get("subcategory_id");
    const subcategoryName = params.get("subcategory_name") || "Subcategory";
    const childcategoryId = params.get("childcategory_id");
    const childcategoryName = params.get("childcategory_name") || "Service";
    const itemId = params.get("item_id");
    const itemType = String(params.get("item_type") || "").toUpperCase();

    const state = {
      item: null,
      currency:
        localStorage.getItem("selectedCurrency") === "USD"
          ? "USD"
          : "LBP",
      checkedCounter: null,
      checkedTotal: null,
    };

    const loading = document.getElementById("loading");
    const page = document.getElementById("page");
    const pageError = document.getElementById("pageError");
    const itemCard = document.getElementById("itemCard");
    const itemVisual = document.getElementById("itemVisual");
    const itemTypeBadge = document.getElementById("itemTypeBadge");
    const itemName = document.getElementById("itemName");
    const itemDescription = document.getElementById("itemDescription");
    const itemFacts = document.getElementById("itemFacts");
    const packageOrderBox = document.getElementById("packageOrderBox");
    const counterOrderBox = document.getElementById("counterOrderBox");
    const targetIdentifier = document.getElementById("targetIdentifier");
    const packageOrderButton = document.getElementById("packageOrderButton");
    const packageMessage = document.getElementById("packageMessage");
    const counterInput = document.getElementById("counterInput");
    const counterHelp = document.getElementById("counterHelp");
    const counterTotalPrice = document.getElementById("counterTotalPrice");
    const checkPriceButton = document.getElementById("checkPriceButton");
    const counterOrderButton = document.getElementById("counterOrderButton");
    const counterMessage = document.getElementById("counterMessage");
    const currencyButtons = document.querySelectorAll(".currency-button");

    function getToken() {
      return localStorage.getItem("token");
    }

    function logout() {
      localStorage.removeItem("token");
      localStorage.removeItem("user");
      window.location.href = "./login.html";
    }

    function formatName(value) {
      return String(value ?? "").replace(/_/g, " ").trim();
    }

    function toNumber(value, fallback = Number.NaN) {
      const number = Number(String(value ?? "").replaceAll(",", "").trim());
      return Number.isFinite(number) ? number : fallback;
    }

    function formatNumber(value) {
      const number = toNumber(value, 0);
      return new Intl.NumberFormat("en-GB", {
        maximumFractionDigits: 2,
      }).format(number);
    }

    function extractArray(result, keys = []) {
      if (Array.isArray(result)) return result;
      for (const key of keys) {
        if (Array.isArray(result?.[key])) return result[key];
      }
      if (Array.isArray(result?.data)) return result.data;
      if (Array.isArray(result?.result)) return result.result;
      return [];
    }

    async function apiRequest(path, options = {}) {
      const requiresAuth = options.auth !== false;
      const token = getToken();

      if (requiresAuth && !token) {
        logout();
        throw new Error("Token not found");
      }

      const response = await fetch(`${API_BASE_URL}${path}`, {
        method: options.method || "GET",
        headers: {
          ...(requiresAuth
            ? { Authorization: `Bearer ${token}` }
            : {}),
          ...(options.body !== undefined
            ? { "Content-Type": "application/json" }
            : {}),
        },
        body:
          options.body !== undefined
            ? JSON.stringify(options.body)
            : undefined,
      });

      const text = await response.text();
      let result = {};

      try {
        result = text ? JSON.parse(text) : {};
      } catch (error) {
        result = { raw: text };
      }

      if (requiresAuth && response.status === 401) {
        logout();
        throw new Error(result.message || "Session expired");
      }

      if (!response.ok || result.success === false) {
        throw new Error(
          result.message ||
          result.error ||
          `Server returned ${response.status}`
        );
      }

      return result;
    }

    function buildBackUrl() {
      const backParams = new URLSearchParams({
        category_id: categoryId || "",
        category_name: categoryName,
        subcategory_id: subcategoryId || "",
        subcategory_name: subcategoryName,
        selected_child_id: childcategoryId || "",
      });

      return `./childcategories.html?${backParams.toString()}`;
    }

    function showMessage(element, message, type) {
      element.textContent = message;
      element.className = `message ${type}`;
    }

    function clearMessage(element) {
      element.textContent = "";
      element.className = "message hidden";
    }

    function getItemPrice() {
      if (!state.item) return null;

      const field =
        itemType === "COUNTER"
          ? state.currency === "USD"
            ? "price_per_unit_usd"
            : "price_per_unit_lbp"
          : state.currency === "USD"
            ? "price_usd"
            : "price_lbp";

      const price = toNumber(state.item[field]);
      return Number.isFinite(price) && price >= 0 ? price : null;
    }

    function addFact(label, value) {
      const box = document.createElement("div");
      box.className = "fact";

      const labelElement = document.createElement("div");
      labelElement.className = "fact-label";
      labelElement.textContent = label;

      const valueElement = document.createElement("div");
      valueElement.className = "fact-value";
      valueElement.textContent = value;

      box.append(labelElement, valueElement);
      itemFacts.appendChild(box);
    }

    function syncCurrency() {
      currencyButtons.forEach((button) => {
        button.classList.toggle(
          "active",
          button.dataset.currency === state.currency
        );
      });
    }

    function resetCounterPrice() {
      state.checkedCounter = null;
      state.checkedTotal = null;
      counterTotalPrice.textContent = "—";
    }

    function renderItem() {
      const item = state.item;
      const price = getItemPrice();

      itemTypeBadge.textContent = itemType;
      itemName.textContent = formatName(item.name) || "Item";
      itemDescription.textContent =
        item.description || "Complete the information below to create the order.";

      itemVisual.innerHTML = "";
      if (item.image_url) {
        const image = document.createElement("img");
        image.className = "item-image";
        image.src = item.image_url;
        image.alt = formatName(item.name);
        itemVisual.appendChild(image);
      } else {
        const placeholder = document.createElement("div");
        placeholder.className = "item-image item-placeholder";
        placeholder.textContent =
          formatName(item.name).charAt(0).toUpperCase() || "?";
        itemVisual.appendChild(placeholder);
      }

      itemFacts.innerHTML = "";
      addFact("Company", formatName(item.company) || "—");
      addFact(
        itemType === "COUNTER" ? "Price per unit" : "Price",
        price === null
          ? `Not available in ${state.currency}`
          : `${formatNumber(price)} ${state.currency}`
      );

      if (itemType === "COUNTER") {
        addFact("Unit", formatName(item.unit) || "Unit");
        addFact(
          "Allowed counter",
          `${formatNumber(item.minimum_amount ?? 0)} – ${formatNumber(
            item.maximum_amount ?? 0
          )}`
        );

        const minimum = toNumber(item.minimum_amount, 0);
        const maximum = toNumber(item.maximum_amount);
        const step = toNumber(item.step_amount);

        if (Number.isFinite(minimum)) counterInput.min = minimum;
        if (Number.isFinite(maximum)) counterInput.max = maximum;
        if (Number.isFinite(step) && step > 0) counterInput.step = step;

        counterHelp.textContent =
          `Minimum: ${formatNumber(minimum)}` +
          (Number.isFinite(maximum)
            ? ` • Maximum: ${formatNumber(maximum)}`
            : "") +
          (Number.isFinite(step) && step > 0
            ? ` • Step: ${formatNumber(step)}`
            : "");

        packageOrderBox.classList.add("hidden");
        counterOrderBox.classList.remove("hidden");
      } else {
        addFact("Value", formatName(item.package_value) || "—");
        addFact("Unit", formatName(item.unit) || "Package");
        counterOrderBox.classList.add("hidden");
        packageOrderBox.classList.remove("hidden");
        packageOrderButton.disabled = price === null;
      }

      itemCard.classList.remove("hidden");
    }

    async function checkCounterPrice(showSuccess = true) {
      clearMessage(counterMessage);

      const numericCounter = toNumber(counterInput.value);
      if (!Number.isFinite(numericCounter) || numericCounter <= 0) {
        showMessage(counterMessage, "Enter a valid counter", "error");
        counterInput.focus();
        return null;
      }

      checkPriceButton.disabled = true;
      checkPriceButton.textContent = "Checking...";

      try {
        const result = await apiRequest(API_PATHS.GET_COUNTER_PRICE, {
          method: "POST",
          auth: false,
          body: {
            item_id: state.item.id,
            counter: numericCounter,
            currency: state.currency,
          },
        });

        const totalPrice = toNumber(
          result.total_price ??
          result.price ??
          result.data?.total_price
        );

        if (!Number.isFinite(totalPrice)) {
          throw new Error("The server did not return a valid price");
        }

        state.checkedCounter = numericCounter;
        state.checkedTotal = totalPrice;
        counterTotalPrice.textContent =
          `${formatNumber(totalPrice)} ${state.currency}`;

        if (showSuccess) {
          showMessage(counterMessage, "Price checked successfully", "success");
        }

        return {
          counter: numericCounter,
          totalPrice,
        };
      } catch (error) {
        resetCounterPrice();
        showMessage(
          counterMessage,
          error.message || "Failed to check price",
          "error"
        );
        return null;
      } finally {
        checkPriceButton.disabled = false;
        checkPriceButton.textContent = "Check price";
      }
    }

    async function createPackageOrder() {
      clearMessage(packageMessage);

      const target = String(targetIdentifier.value || "").trim();
      const price = getItemPrice();

      if (!target) {
        showMessage(
          packageMessage,
          "Target identifier is required",
          "error"
        );
        targetIdentifier.focus();
        return;
      }

      if (price === null) {
        showMessage(
          packageMessage,
          `This item is not available in ${state.currency}`,
          "error"
        );
        return;
      }

      if (!window.confirm(
        `Confirm ${formatName(state.item.name)} for ${target} at ` +
        `${formatNumber(price)} ${state.currency}?`
      )) {
        return;
      }

      packageOrderButton.disabled = true;
      packageOrderButton.textContent = "Processing...";

      try {
        const result = await apiRequest(API_PATHS.CREATE_ORDER_PACKAGE, {
          method: "POST",
          body: {
            item_id: state.item.id,
            target_identifier: target,
            currency: state.currency,
          },
        });

        const orderId =
          result.order?.id ?? result.data?.id ?? result.order_id;

        showMessage(
          packageMessage,
          orderId
            ? `Order #${orderId} created successfully`
            : result.message || "Order created successfully",
          "success"
        );
        targetIdentifier.value = "";
      } catch (error) {
        showMessage(
          packageMessage,
          error.message || "Failed to create order",
          "error"
        );
      } finally {
        packageOrderButton.disabled = getItemPrice() === null;
        packageOrderButton.textContent = "Create order";
      }
    }

    async function createCounterOrder() {
      clearMessage(counterMessage);

      const checked = await checkCounterPrice(false);
      if (!checked) return;

      if (!window.confirm(
        `Confirm ${formatName(state.item.name)} × ${formatNumber(
          checked.counter
        )} for ${formatNumber(checked.totalPrice)} ${state.currency}?`
      )) {
        return;
      }

      counterOrderButton.disabled = true;
      counterOrderButton.textContent = "Processing...";

      try {
        const result = await apiRequest(API_PATHS.CREATE_ORDER_COUNTER, {
          method: "POST",
          body: {
            item_id: state.item.id,
            counter: checked.counter,
            currency: state.currency,
          },
        });

        const orderId =
          result.order?.id ?? result.data?.id ?? result.order_id;

        showMessage(
          counterMessage,
          orderId
            ? `Order #${orderId} created successfully`
            : result.message || "Order created successfully",
          "success"
        );
        counterInput.value = "";
        resetCounterPrice();
      } catch (error) {
        showMessage(
          counterMessage,
          error.message || "Failed to create counter order",
          "error"
        );
      } finally {
        counterOrderButton.disabled = false;
        counterOrderButton.textContent = "Create order";
      }
    }

    async function loadPage() {
      if (
        !categoryId ||
        !subcategoryId ||
        !childcategoryId ||
        !itemId ||
        (itemType !== "PACKAGE" && itemType !== "COUNTER")
      ) {
        window.location.href = "./home.html";
        return;
      }

      document.getElementById("categoryCrumb").textContent = categoryName;
      document.getElementById("subcategoryCrumb").textContent = subcategoryName;
      document.getElementById("childCrumb").textContent = childcategoryName;
      document.getElementById("backButton").addEventListener("click", () => {
        window.location.href = buildBackUrl();
      });

      try {
        const path =
          itemType === "COUNTER"
            ? API_PATHS.ITEMS_COUNTER
            : API_PATHS.ITEMS_PACKAGE;

        const result = await apiRequest(path);
        const items = extractArray(
          result,
          itemType === "COUNTER"
            ? ["items", "counters", "items_counter"]
            : ["items", "packages", "items_package"]
        );

        state.item = items.find(
          (item) =>
            String(item.id) === String(itemId) &&
            String(item.childcategory_id) === String(childcategoryId)
        );

        if (!state.item || state.item.is_active === false) {
          throw new Error("The selected item was not found");
        }

        syncCurrency();
        renderItem();
      } catch (error) {
        pageError.textContent = error.message || "Unable to load item";
        pageError.classList.remove("hidden");
      } finally {
        loading.classList.add("hidden");
        page.classList.remove("hidden");
      }
    }

    currencyButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const currency = button.dataset.currency;
        if (currency !== "LBP" && currency !== "USD") return;

        state.currency = currency;
        localStorage.setItem("selectedCurrency", currency);
        resetCounterPrice();
        clearMessage(packageMessage);
        clearMessage(counterMessage);
        syncCurrency();

        if (state.item) renderItem();
      });
    });

    counterInput.addEventListener("input", () => {
      resetCounterPrice();
      clearMessage(counterMessage);
    });
    targetIdentifier.addEventListener("keydown", (event) => {
      if (event.key === "Enter") createPackageOrder();
    });
    counterInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") checkCounterPrice();
    });

    checkPriceButton.addEventListener("click", () => checkCounterPrice());
    packageOrderButton.addEventListener("click", createPackageOrder);
    counterOrderButton.addEventListener("click", createCounterOrder);
    document.getElementById("logoutButton").addEventListener("click", logout);

    loadPage();
  </script>
</body>
</html>
