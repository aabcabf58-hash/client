<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Services & Items</title>
  <link rel="stylesheet" href="./site.css">
  <link rel="stylesheet" href="./theme.css">
  <script src="./app-navigation.js" defer></script>

  <style>
    .breadcrumb {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 22px;
      color: var(--muted);
      font-size: 14px;
    }

    .breadcrumb a {
      color: #a63a00;
    }

    .child-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 16px;
    }

    .child-card {
      min-height: 175px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 13px;
      padding: 20px;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 19px;
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }

    .child-card:hover {
      transform: translateY(-3px);
      border-color: #a63a00;
    }

    .child-card.active {
      background: #ffe1cc;
      border-color: #a63a00;
    }

    .child-image {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      object-fit: cover;
      color: #7f2c00;
      background: var(--card-soft);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 30px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .child-name {
      font-size: 18px;
      font-weight: 800;
      text-align: center;
      text-transform: capitalize;
    }

    .items-section {
      margin-top: 34px;
    }

    .balance-direct-container {
      display: grid;
      grid-template-columns: minmax(0, 900px);
      justify-content: center;
      align-items: start;
      width: 100%;
    }

    .balance-direct-card {
      display: grid;
      gap: 14px;
      height: fit-content;
      padding: 20px;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }

    .balance-direct-card label { display: grid; gap: 8px; }

    .balance-direct-price {
      min-height: 50px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      color: #a63a00;
      background: var(--card-soft);
      border: 1px solid var(--border);
      border-radius: 13px;
      font-size: 18px;
      font-weight: 900;
    }


    /* Days special service */
    .days-items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 18px;
    }

    .days-item-card {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 20px;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }

    .days-item-head,
    .days-toolbar,
    .recharge-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .days-toolbar {
      align-items: center;
      margin-bottom: 16px;
    }

    .days-item-title {
      margin: 0;
      font-size: 22px;
      font-weight: 900;
      text-transform: capitalize;
    }

    .days-item-note {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .active-badge {
      padding: 6px 10px;
      color: #d8ffe8;
      background: rgba(34, 197, 94, 0.16);
      border: 1px solid rgba(34, 197, 94, 0.4);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .days-price-grid,
    .year-summary-grid,
    .year-numbers-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .days-price-box,
    .year-summary-box,
    .year-number-box {
      padding: 12px;
      background: var(--card-soft);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .days-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .days-value {
      margin-top: 5px;
      overflow-wrap: anywhere;
      font-size: 16px;
      font-weight: 900;
    }

    .year-number-value {
      margin-top: 5px;
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 15px;
      font-weight: 900;
    }

    .year-order-form {
      padding-top: 15px;
      border-top: 1px solid var(--border);
    }

    .year-field-label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .year-input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px 14px;
      color: var(--text);
      background: var(--card-soft);
      border: 1px solid var(--border);
      border-radius: 13px;
      outline: none;
      font: inherit;
    }

    .year-input:focus {
      border-color: #a63a00;
      box-shadow: 0 0 0 3px rgba(77, 156, 255, 0.13);
    }

    .year-form-actions,
    .year-result-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .year-action-button {
      flex: 1 1 145px;
      min-height: 44px;
      padding: 11px 15px;
      color: #fff;
      background: #a63a00;
      border: 0;
      border-radius: 13px;
      cursor: pointer;
      font: inherit;
      font-weight: 900;
    }

    .year-action-button.check { background: #059669; }
    .year-action-button.confirm { background: #d97706; }
    .year-action-button.copy { background: #0369a1; }
    .year-action-button.secondary {
      color: var(--text);
      background: var(--card-soft);
      border: 1px solid var(--border);
    }
    .year-action-button:disabled { cursor: not-allowed; opacity: 0.55; }

    .year-result {
      padding: 15px;
      background: rgba(37, 99, 235, 0.08);
      border: 1px solid rgba(77, 156, 255, 0.35);
      border-radius: 17px;
    }

    .year-confirm-box {
      margin-top: 14px;
      padding: 14px;
      background: rgba(217, 119, 6, 0.10);
      border: 1px solid rgba(245, 158, 11, 0.42);
      border-radius: 15px;
    }

    .year-confirm-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.55;
    }

    .year-confirm-label input {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      margin-top: 1px;
      accent-color: #d97706;
    }

    .year-confirm-warning {
      margin-top: 8px;
      color: #fbbf24;
      font-size: 11px;
      line-height: 1.5;
    }

    .year-complete-box {
      margin-top: 14px;
      padding: 14px;
      color: #dcfce7;
      background: rgba(22, 163, 74, 0.12);
      border: 1px solid rgba(74, 222, 128, 0.35);
      border-radius: 15px;
    }

    .year-result-title {
      margin: 0 0 12px;
      font-size: 17px;
      font-weight: 900;
    }

    .recharge-card-box {
      margin-top: 10px;
      padding: 14px;
      background: rgba(3, 105, 161, 0.10);
      border: 1px solid rgba(56, 189, 248, 0.42);
      border-radius: 15px;
    }

    .recharge-code {
      margin-top: 10px;
      padding: 12px;
      overflow-wrap: anywhere;
      color: #e0f2fe;
      background: rgba(17, 24, 39, 0.75);
      border: 1px dashed rgba(125, 211, 252, 0.55);
      border-radius: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .item-message {
      margin-top: 10px;
      padding: 12px;
      border-radius: 13px;
      font-size: 13px;
      line-height: 1.5;
    }

    .item-message.info {
      color: #dbeafe;
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid rgba(96, 165, 250, 0.35);
    }

    .item-message.error {
      color: #fee2e2;
      background: rgba(220, 38, 38, 0.12);
      border: 1px solid rgba(248, 113, 113, 0.35);
    }

    .item-message.success {
      color: #dcfce7;
      background: rgba(22, 163, 74, 0.12);
      border: 1px solid rgba(74, 222, 128, 0.35);
    }

    .empty-wide { grid-column: 1 / -1; }

    @media (max-width: 640px) {
      .days-price-grid,
      .year-summary-grid,
      .year-numbers-grid {
        grid-template-columns: 1fr;
      }
    }

  </style>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff7f0;
      --background: #fff7f0;
      --card: #ffffff;
      --card-soft: #fff0e3;
      --text: #2d1b12;
      --muted: #806354;
      --border: #edc7ae;
      --shadow: 0 12px 32px rgba(127, 44, 0, 0.10);
    }

    html,
    body {
      min-height: 100%;
      height: auto !important;
      overflow-x: hidden;
      overflow-y: auto !important;
    }

    body {
      margin: 0;
      background: var(--bg) !important;
      color: var(--text) !important;
    }

    .page {
      width: min(calc(100% - 32px), 1280px) !important;
      max-width: 1280px !important;
      min-height: 0 !important;
      height: auto !important;
      max-height: none !important;
      overflow: visible !important;
      margin: 0 auto !important;
      padding: 24px 0 48px !important;
      box-sizing: border-box;
    }

    .topbar {
      min-height: 84px;
      padding: 18px 20px !important;
    }

    .topbar h1 {
      font-size: clamp(24px, 3vw, 32px);
    }

    .navbar {
      min-height: 52px;
      padding: 6px !important;
      gap: 6px;
    }

    .nav-link {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    .topbar,
    .navbar,
    .panel,
    .child-card,
    .item-card,
    .summary-card,
    .child-grid,
    .items-grid,
    .item-section,
    .item-form,
    .statistics {
      background: var(--card) !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
    }

    .nav-link.active,
    .item-type-button.active,
    .filter-button.active {
      background: #ffe1cc !important;
      color: #7f2c00 !important;
    }

    .button:not(.secondary),
    .logout-button,
    .save-button {
      background: #a63a00 !important;
      color: #fff !important;
      border-color: #a63a00 !important;
    }

    .button.secondary,
    .filter-button,
    .item-type-button,
    .status,
    .badge,
    .message,
    .item-message,
    .count {
      background: #fff0e3 !important;
      color: #7f2c00 !important;
      border-color: var(--border) !important;
    }

    a,
    .nav-link,
    .child-arrow,
    .item-arrow {
      color: #a63a00 !important;
    }

    input,
    select,
    textarea,
    .search-input,
    .filter-input,
    .input {
      background: #fffaf6 !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
    }

    main,
    section,
    .panel,
    .child-grid,
    .items-grid,
    .item-section,
    .item-form {
      max-height: none !important;
      overflow-y: visible !important;
    }

    .child-grid,
    .items-grid {
      width: 100% !important;
      max-width: none !important;
    }

    @media (max-width: 640px) {
      .page {
        width: calc(100% - 20px) !important;
        padding: 12px 0 32px !important;
      }
    }
  </style>
  <style>
    .child-grid {
      display: flex !important;
      flex-wrap: nowrap !important;
      gap: 11px !important;
      padding: 11px 3px 8px !important;
      overflow-x: auto !important;
      overflow-y: hidden !important;
      scrollbar-width: thin;
      background: transparent !important;
      scroll-snap-type: x proximity;
    }

    .child-card {
      position: relative;
      flex: 0 0 118px !important;
      min-width: 118px !important;
      min-height: 84px !important;
      gap: 6px !important;
      padding: 13px 8px 9px !important;
      background: #ffffff !important;
      border-radius: 7px 14px 14px 14px !important;
      isolation: isolate;
      scroll-snap-align: start;
    }

    .child-card::before {
      content: "";
      position: absolute;
      top: -9px;
      left: -1px;
      width: 43%;
      height: 15px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-bottom: 0;
      border-radius: 9px 11px 0 0;
      z-index: -1;
    }

    .child-card.active {
      background: #ffe1cc !important;
      border-color: #a63a00 !important;
    }
    .child-card.active::before { background: #ffe1cc; border-color: #a63a00; }

    .child-image {
      width: 34px !important;
      height: 34px !important;
      border-radius: 10px !important;
      font-size: 15px !important;
    }
    .child-name { font-size: 12px !important; }

    .days-items-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
      gap: 14px !important;
    }
    .days-item-link {
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      padding: 17px;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 17px;
      box-shadow: var(--shadow);
      cursor: pointer;
      text-align: left;
      font: inherit;
      transition: transform .18s ease, border-color .18s ease;
    }
    .days-item-link:hover { transform: translateY(-3px); border-color: #a63a00; }
    .days-item-link-title { font-size: 17px; font-weight: 900; text-transform: capitalize; }
    .days-item-link-bottom { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 12px; font-weight: 800; }

    .days-item-card-link {
      width: 100%;
      color: var(--text);
      text-align: left;
      font: inherit;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease;
    }

    .days-item-card-link:hover {
      transform: translateY(-3px);
      border-color: #a63a00 !important;
    }

    @media (max-width: 900px) {
      .days-items-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
    }

    @media (max-width: 640px) {
      .child-grid { gap: 8px !important; }
      .child-card {
        flex-basis: 88px !important;
        min-width: 88px !important;
        min-height: 70px !important;
        padding: 10px 6px 7px !important;
      }
      .child-image { width: 29px !important; height: 29px !important; font-size: 13px !important; }
      .child-name { font-size: 10px !important; }
      .items-section { margin-top: 24px !important; }
      .days-items-grid { grid-template-columns: 1fr 1fr !important; gap: 9px !important; }
      .days-item-link { min-height: 92px; padding: 12px; border-radius: 14px; }
      .days-item-link-title { font-size: 14px; }
      .days-item-link-bottom { font-size: 10px; }
    }
  </style>
  <style>
    /* Child-category tabs inspired by the supplied reference. */
    .child-tabs-section {
      margin-top: 8px;
      padding: 0 !important;
      background: transparent !important;
      border: 0 !important;
      box-shadow: none !important;
    }

    .child-tabs-section .section-header { display: none !important; }

    .child-grid {
      display: flex !important;
      align-items: center !important;
      flex-wrap: nowrap !important;
      gap: 6px !important;
      width: 100% !important;
      padding: 11px 13px !important;
      overflow-x: auto !important;
      overflow-y: hidden !important;
      background: #ffffff !important;
      border: 0 !important;
      border-bottom: 8px solid #f1f4f7 !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      box-sizing: border-box;
      scrollbar-width: none;
      scroll-snap-type: x proximity;
    }

    .child-grid::-webkit-scrollbar { display: none; }

    .child-card {
      position: relative;
      flex: 0 0 auto !important;
      min-width: max-content !important;
      min-height: 40px !important;
      height: 40px !important;
      display: inline-flex !important;
      flex-direction: row !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 0 !important;
      padding: 0 17px !important;
      color: #969ba2 !important;
      background: transparent !important;
      border: 0 !important;
      border-radius: 20px !important;
      box-shadow: none !important;
      scroll-snap-align: start;
      white-space: nowrap;
    }

    .child-card::before { display: none !important; }

    .child-card:hover {
      color: #4b5563 !important;
      background: #f5f7f8 !important;
      transform: none !important;
    }

    .child-card.active {
      color: #7f2c00 !important;
      background: #ffe1cc !important;
      border: 0 !important;
    }

    .child-card.active::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 4px;
      width: 20px;
      height: 2px;
      background: #a63a00;
      border-radius: 999px;
      transform: translateX(-50%);
    }

    .child-image { display: none !important; }

    .child-name {
      color: inherit !important;
      font-size: 12px !important;
      font-weight: 500 !important;
      line-height: 1 !important;
      text-transform: none !important;
      white-space: nowrap;
    }

    .items-section { margin-top: 20px !important; }

    /* Items are intentionally about half the former visual size. */
    .items-grid {
      display: grid !important;
      grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
      gap: 9px !important;
      background: transparent !important;
    }

    .item-card {
      min-height: 72px !important;
      display: flex !important;
      align-items: center !important;
      gap: 8px !important;
      padding: 9px !important;
      border-radius: 12px !important;
      box-shadow: 0 5px 14px rgba(31, 41, 55, .06) !important;
      box-sizing: border-box;
    }

    .item-image {
      width: 40px !important;
      height: 40px !important;
      min-width: 40px !important;
      flex: 0 0 40px !important;
      border-radius: 10px !important;
      font-size: 15px !important;
    }

    .item-content { min-width: 0 !important; }

    .item-name {
      margin: 0 !important;
      font-size: 13px !important;
      line-height: 1.15 !important;
    }

    .item-description {
      margin: 3px 0 5px !important;
      display: -webkit-box;
      overflow: hidden;
      color: var(--muted) !important;
      font-size: 9px !important;
      line-height: 1.25 !important;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .item-meta { gap: 5px !important; }
    .price-label { font-size: 8px !important; }
    .price { font-size: 12px !important; }
    .badge { padding: 3px 5px !important; font-size: 8px !important; }

    .days-items-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
      gap: 8px !important;
    }

    .days-item-link {
      min-height: 58px !important;
      gap: 7px !important;
      padding: 8px !important;
      border-radius: 10px !important;
      box-shadow: 0 5px 14px rgba(31, 41, 55, .06) !important;
    }

    .days-item-link-title { font-size: 10px !important; }
    .days-item-link-bottom { gap: 5px !important; font-size: 7px !important; }

    @media (min-width: 1180px) {
      .items-grid,
      .days-items-grid { grid-template-columns: repeat(5, minmax(0, 1fr)) !important; }
    }

    @media (max-width: 640px) {
      .child-grid {
        gap: 2px !important;
        padding: 9px 8px !important;
        border-bottom-width: 6px !important;
      }
      .child-card {
        min-width: max-content !important;
        min-height: 37px !important;
        height: 37px !important;
        padding: 0 13px !important;
      }
      .child-name { font-size: 11px !important; }

      .items-grid,
      .days-items-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: 7px !important;
      }

      .item-card {
        min-height: 64px !important;
        gap: 6px !important;
        padding: 7px !important;
      }
      .item-image {
        width: 34px !important;
        height: 34px !important;
        min-width: 34px !important;
        flex-basis: 34px !important;
      }
      .item-name { font-size: 11px !important; }
      .item-description { font-size: 8px !important; }
      .price { font-size: 10px !important; }
    }
  </style>
  <style>
    .currency-switch {
      display: inline-flex;
      padding: 3px;
      background: #fff0e3;
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .currency-button {
      min-width: 48px;
      height: 34px;
      padding: 0 9px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 9px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 900;
    }
    .currency-button.active { color: #fff; background: #a63a00; }
    .item-card { cursor: pointer; flex-wrap: wrap; }
    .package-order-panel {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 7px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .package-target-input {
      width: 100%;
      min-width: 0;
      height: 38px;
      padding: 0 10px;
      color: var(--text);
      background: #fffaf6;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      font: inherit;
      font-size: 12px;
    }
    .package-target-input:focus {
      border-color: #a63a00;
      box-shadow: 0 0 0 3px rgba(166, 58, 0, .12);
    }
    .package-buy-button {
      min-height: 38px;
      padding: 0 13px;
      color: #fff;
      background: #a63a00;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }
    .package-buy-button:disabled { cursor: not-allowed; opacity: .55; }
    .package-order-message {
      grid-column: 1 / -1;
      min-height: 16px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.35;
    }
    .package-order-message.error { color: #b42318; }
    .package-order-message.success { color: #087b4b; }
    @media (max-width: 640px) {
      .currency-button { min-width: 43px; padding: 0 7px; }
      .package-order-panel { grid-template-columns: 1fr; }
      .package-order-message { grid-column: 1; }
      .package-buy-button { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">Loading services...</div>

  <main id="page" class="page hidden">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Services</h1>
        <p>Choose a service to view its items.</p>
      </div>

      <div class="topbar-actions">
        <div class="currency-switch" aria-label="Select currency">
          <button class="currency-button" data-currency="LBP" type="button">LBP</button>
          <button class="currency-button" data-currency="USD" type="button">USD</button>
        </div>
        <a class="button secondary" href="./home.html" title="Home" aria-label="Home">🏠</a>
        <button id="backButton" class="button secondary" type="button">
          Back
        </button>
      </div>
    </header>

    <div class="breadcrumb">
      <a href="./home.html">Categories</a>
      <span>›</span>
      <a id="categoryBackLink" href="./home.html">Category</a>
      <span>›</span>
      <span id="breadcrumbSubcategory">Subcategory</span>
    </div>

    <div id="pageError" class="error-box hidden"></div>

    <section class="child-tabs-section">
      <div class="section-header">
        <h2>Services</h2>
        <span id="childrenCount" class="count"></span>
      </div>

      <div id="childrenContainer" class="child-grid"></div>
    </section>

    <section class="items-section">
      <div class="section-header">
        <h2 id="itemsTitle">Items</h2>
        <span id="itemsCount" class="count"></span>
      </div>

      <div id="itemsContainer" class="items-grid"></div>
    </section>
  </main>

  <script>
    const API_BASE_URL =
      "https://abdd-production.up.railway.app";

    const API_PATHS = {
      CATEGORIES_TREE: "/category/getAllCategoriesTree",
      ITEMS_PACKAGE: "/category/getAllItemsPackage",
      ITEMS_COUNTER: "/category/getAllItemsCounter",
      ITEMS_BALANCE: "/category/getAllItemsBalance",
      BALANCE_PRICE: "/category/getBalancePrice",
      ITEMS_DAYS: "/category/getAllItemsDays",
      GET_YEAR: "/api/ushare/getyear",
      CHECK_YEAR: "/api/ushare/chekyear",
      CONFIRM_YEAR: "/api/ushare/confirmYear",
      CREATE_ORDER: "/orders/createOrder",
    };

    const params = new URLSearchParams(window.location.search);
    const categoryId = params.get("category_id");
    const categoryNameFromUrl = params.get("category_name") || "Category";
    const subcategoryId = params.get("subcategory_id");
    const subcategoryNameFromUrl =
      params.get("subcategory_name") || "Subcategory";
    const selectedChildIdFromUrl = params.get("selected_child_id");

    const state = {
      selectedChildcategoryId: null,
      children: [],
      packageItems: [],
      counterItems: [],
      balanceItems: [],
      daysItems: [],
      daysItemsLoaded: false,
      daysItemsError: "",
      currentCategory: null,
      currentSubcategory: null,
      selectedCurrency:
        localStorage.getItem("selectedCurrency") === "USD"
          ? "USD"
          : "LBP",
      expandedPackageItemId: null,
    };

    const yearResultsByItemId = new Map();
    const balancePriceRequestIds = new Map();
    const balancePricesByItemId = new Map();

    const loading = document.getElementById("loading");
    const page = document.getElementById("page");
    const pageTitle = document.getElementById("pageTitle");
    const pageError = document.getElementById("pageError");
    const backButton = document.getElementById("backButton");
    const categoryBackLink =
      document.getElementById("categoryBackLink");
    const breadcrumbSubcategory =
      document.getElementById("breadcrumbSubcategory");
    const childrenContainer =
      document.getElementById("childrenContainer");
    const childrenCount =
      document.getElementById("childrenCount");
    const itemsContainer =
      document.getElementById("itemsContainer");
    const itemsTitle = document.getElementById("itemsTitle");
    const itemsCount = document.getElementById("itemsCount");
    const currencyButtons = document.querySelectorAll(".currency-button");

    function getToken() {
      return localStorage.getItem("token");
    }

    function logout() {
      localStorage.removeItem("token");
      localStorage.removeItem("user");
      window.location.href = "./login.html";
    }

    function formatName(value) {
      return String(value ?? "")
        .replace(/_/g, " ")
        .trim();
    }

    function normalizeName(value) {
      return formatName(value).toLowerCase();
    }

    function formatNumber(value) {
      const numericValue = Number(
        String(value ?? 0).replaceAll(",", "").trim()
      );

      if (!Number.isFinite(numericValue)) {
        return "0";
      }

      return new Intl.NumberFormat("en-GB", {
        maximumFractionDigits: 2,
      }).format(numericValue);
    }

    function toNumber(value, fallback = 0) {
      const numericValue = Number(
        String(value ?? "").replaceAll(",", "").trim()
      );

      return Number.isFinite(numericValue)
        ? numericValue
        : fallback;
    }

    function toBoolean(value, fallback = false) {
      if (typeof value === "boolean") return value;
      if (value === 1 || value === "1" || String(value).toLowerCase() === "true") return true;
      if (value === 0 || value === "0" || String(value).toLowerCase() === "false") return false;
      return fallback;
    }

    function firstLetter(value) {
      const text = formatName(value);
      return text ? text.charAt(0).toUpperCase() : "?";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeJsString(value) {
      return String(value ?? "")
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'")
        .replaceAll("\n", "\\n")
        .replaceAll("\r", "\\r");
    }

    function extractArray(result, keys = []) {
      if (Array.isArray(result)) return result;

      for (const key of keys) {
        if (Array.isArray(result?.[key])) {
          return result[key];
        }
      }

      if (Array.isArray(result?.data)) return result.data;
      if (Array.isArray(result?.result)) return result.result;
      return [];
    }

    async function apiRequest(path, options = {}) {
      const token = getToken();

      if (!token) {
        logout();
        throw new Error("Token not found");
      }

      const response = await fetch(`${API_BASE_URL}${path}`, {
        method: options.method || "GET",
        headers: {
          Authorization: `Bearer ${token}`,
          ...(options.body !== undefined
            ? { "Content-Type": "application/json" }
            : {}),
          ...(options.headers || {}),
        },
        body: options.body !== undefined
          ? JSON.stringify(options.body)
          : undefined,
      });

      const text = await response.text();
      let result = {};

      try {
        result = text ? JSON.parse(text) : {};
      } catch (error) {
        result = { raw: text };
      }

      if (response.status === 401) {
        logout();
        throw new Error(result.message || "Session expired");
      }

      if (response.status === 403) {
        throw new Error(
          result.message || "You do not have permission for this request"
        );
      }

      if (!response.ok || result.success === false) {
        throw new Error(
          result.message ||
          result.error ||
          `Server returned ${response.status}`
        );
      }

      return result;
    }

    async function getCategoriesTree() {
      const result = await apiRequest(API_PATHS.CATEGORIES_TREE);
      return extractArray(result, ["categories", "tree", "items"]);
    }

    async function getAllItemsPackage() {
      const result = await apiRequest(API_PATHS.ITEMS_PACKAGE);
      return extractArray(result, ["items", "packages", "items_package"]);
    }

    async function getAllItemsCounter() {
      const result = await apiRequest(API_PATHS.ITEMS_COUNTER);
      return extractArray(result, ["items", "counters", "items_counter"]);
    }

    async function getAllItemsBalance() {
      const result = await apiRequest(API_PATHS.ITEMS_BALANCE);
      return extractArray(result, ["items", "balances", "items_balance"]);
    }

    function normalizeDaysItem(item) {
      return {
        id: item.id,
        name: String(item.name ?? "").trim(),
        description: String(item.description ?? "").trim(),
        image_url: item.image_url ?? null,
        childcategory_id: item.childcategory_id ?? null,
        full_card_price: toNumber(item.full_card_price),
        base_dollar_amount: toNumber(item.base_dollar_amount),
        base_sene: toNumber(item.base_sene),
        balance_plus_price_per_dollar: toNumber(
          item.balance_plus_price_per_dollar
        ),
        balance_minus_price_per_dollar: toNumber(
          item.balance_minus_price_per_dollar
        ),
        active: toBoolean(item.active ?? item.is_active, true),
        sort_order: toNumber(item.sort_order, 0),
        raw: item,
      };
    }

    async function loadAllItemsDays() {
      state.daysItemsError = "";

      try {
        const result = await apiRequest(API_PATHS.ITEMS_DAYS);

        state.daysItems = extractArray(
          result,
          ["items", "items_days", "days"]
        )
          .map(normalizeDaysItem)
          .filter((item) => item.active)
          .sort(
            (firstItem, secondItem) =>
              firstItem.sort_order - secondItem.sort_order ||
              firstItem.name.localeCompare(secondItem.name)
          );
      } catch (error) {
        state.daysItems = [];
        state.daysItemsError =
          error.message || "Unable to load Items Days";
        throw error;
      } finally {
        state.daysItemsLoaded = true;
      }
    }

    function isDaysChild(child) {
      return (
        normalizeName(state.currentSubcategory?.name) === "alfa" &&
        normalizeName(child?.name) === "days"
      );
    }

    function getSelectedChild() {
      return state.children.find(
        (child) =>
          String(child.id) ===
          String(state.selectedChildcategoryId)
      );
    }

    function renderChildren() {
      childrenContainer.innerHTML = "";
      childrenCount.textContent = String(state.children.length);

      if (state.children.length === 0) {
        childrenContainer.innerHTML =
          '<div class="empty">No services are available</div>';
        renderItems();
        return;
      }

      for (const child of state.children) {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "child-card";

        if (
          String(child.id) ===
          String(state.selectedChildcategoryId)
        ) {
          card.classList.add("active");
        }

        let image;

        if (child.image_url) {
          image = document.createElement("img");
          image.src = child.image_url;
          image.alt = formatName(child.name);
          image.className = "child-image";
        } else {
          image = document.createElement("div");
          image.className = "child-image";
          image.textContent = firstLetter(child.name);
        }

        const name = document.createElement("div");
        name.className = "child-name";
        name.textContent = formatName(child.name);

        card.appendChild(image);
        card.appendChild(name);

        card.addEventListener("click", function () {
          state.selectedChildcategoryId = child.id;
          renderChildren();
          renderItems();

          if (isDaysChild(child) && !state.daysItemsLoaded) {
            reloadDaysItems();
          }
        });

        childrenContainer.appendChild(card);
      }
    }

    function getPackagePrice(item) {
      const priceField =
        state.selectedCurrency === "USD"
          ? "price_usd"
          : "price_lbp";

      if (
        item?.[priceField] === undefined ||
        item?.[priceField] === null ||
        item?.[priceField] === ""
      ) {
        return null;
      }

      const price = toNumber(item[priceField], Number.NaN);
      return Number.isFinite(price) && price >= 0 ? price : null;
    }

    function syncCurrencyButtons() {
      currencyButtons.forEach((button) => {
        button.classList.toggle(
          "active",
          button.dataset.currency === state.selectedCurrency
        );
      });
    }

    function selectCurrency(currency) {
      if (currency !== "LBP" && currency !== "USD") return;

      state.selectedCurrency = currency;
      state.expandedPackageItemId = null;
      localStorage.setItem("selectedCurrency", currency);
      syncCurrencyButtons();
      renderItems();
    }

    async function submitPackageOrder(item, input, button, message) {
      const targetIdentifier = String(input.value ?? "").trim();
      const price = getPackagePrice(item);

      message.className = "package-order-message";
      message.textContent = "";

      if (!targetIdentifier) {
        message.classList.add("error");
        message.textContent = "Target identifier is required";
        input.focus();
        return;
      }

      if (price === null) {
        message.classList.add("error");
        message.textContent =
          `This item is not available in ${state.selectedCurrency}`;
        return;
      }

      const confirmed = window.confirm(
        `Confirm ${formatName(item.name)} for ${targetIdentifier} ` +
        `at ${formatNumber(price)} ${state.selectedCurrency}?`
      );

      if (!confirmed) return;

      button.disabled = true;
      button.textContent = "Processing...";

      try {
        const result = await apiRequest(
          API_PATHS.CREATE_ORDER,
          {
            method: "POST",
            body: {
              item_id: item.id,
              item_type: "PACKAGE",
              target_identifier: targetIdentifier,
              currency: state.selectedCurrency,
            },
          }
        );

        const orderId =
          result?.order?.id ??
          result?.data?.id ??
          result?.order_id ??
          null;

        message.classList.add("success");
        message.textContent = orderId
          ? `Order #${orderId} created successfully`
          : (result.message || "Order created successfully");
        input.value = "";
      } catch (error) {
        message.classList.add("error");
        message.textContent = error.message || "Failed to create order";
      } finally {
        button.disabled = false;
        button.textContent = "Purchase";
      }
    }

    function createPackageOrderPanel(item) {
      const panel = document.createElement("div");
      panel.className = "package-order-panel";

      const input = document.createElement("input");
      input.className = "package-target-input";
      input.id = `package-target-${item.id}`;
      input.type = "text";
      input.autocomplete = "off";
      input.placeholder = "Enter target identifier";
      input.setAttribute("aria-label", "Target identifier");

      const button = document.createElement("button");
      button.className = "package-buy-button";
      button.type = "button";
      button.textContent = "Purchase";
      button.disabled = getPackagePrice(item) === null;

      const message = document.createElement("div");
      message.className = "package-order-message";
      if (button.disabled) {
        message.classList.add("error");
        message.textContent =
          `Not available in ${state.selectedCurrency}`;
      }

      panel.addEventListener("click", (event) => event.stopPropagation());
      panel.addEventListener("keydown", (event) => event.stopPropagation());
      button.addEventListener("click", () => {
        submitPackageOrder(item, input, button, message);
      });
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !button.disabled) {
          event.preventDefault();
          submitPackageOrder(item, input, button, message);
        }
      });

      panel.appendChild(input);
      panel.appendChild(button);
      panel.appendChild(message);
      return panel;
    }

    function getVisiblePackageItems() {
      if (state.selectedChildcategoryId === null) {
        return [];
      }

      return state.packageItems
        .filter(
          (item) =>
            item.is_active !== false &&
            String(item.childcategory_id) ===
              String(state.selectedChildcategoryId)
        )
        .sort(
          (firstItem, secondItem) =>
            Number(firstItem.sort_order ?? 0) -
            Number(secondItem.sort_order ?? 0)
        );
    }

    function getVisibleCounterItems() {
      if (state.selectedChildcategoryId === null) {
        return [];
      }

      return state.counterItems.filter(
        (item) =>
          item.is_active !== false &&
          String(item.childcategory_id) ===
            String(state.selectedChildcategoryId)
      );
    }

    function getVisibleBalanceItems() {
      if (state.selectedChildcategoryId === null) return [];
      return state.balanceItems.filter(
        (item) =>
          item.is_active !== false &&
          String(item.childcategory_id) === String(state.selectedChildcategoryId)
      );
    }

    function getBalanceUnitPrice(item) {
      const field = state.selectedCurrency === "USD"
        ? "price_per_dollar_usd"
        : "price_per_dollar_lbp";
      if (item?.[field] === undefined || item?.[field] === null || item?.[field] === "") return null;
      const price = toNumber(item[field], Number.NaN);
      return Number.isFinite(price) && price >= 0 ? price : null;
    }

    function getCounterPrice(item) {
      const priceField =
        state.selectedCurrency === "USD"
          ? "price_per_unit_usd"
          : "price_per_unit_lbp";

      if (
        item?.[priceField] === undefined ||
        item?.[priceField] === null ||
        item?.[priceField] === ""
      ) {
        return null;
      }

      const price = toNumber(item[priceField], Number.NaN);
      return Number.isFinite(price) && price >= 0 ? price : null;
    }

    function openItemPage(item, itemType, selectedChild) {
      const itemParams = new URLSearchParams({
        category_id: categoryId,
        category_name:
          state.currentCategory?.name || categoryNameFromUrl,
        subcategory_id: subcategoryId,
        subcategory_name:
          state.currentSubcategory?.name || subcategoryNameFromUrl,
        childcategory_id: selectedChild.id,
        childcategory_name: selectedChild.name || "Items",
        item_id: item.id,
        item_type: itemType,
      });

      window.location.href = `./items.html?${itemParams.toString()}`;
    }

    function getVisibleDaysItems(child) {
      return state.daysItems.filter(
        (item) =>
          String(item.childcategory_id) === String(child?.id)
      );
    }

    function renderItems() {
      itemsContainer.innerHTML = "";

      const selectedChild = getSelectedChild();

      if (!selectedChild) {
        itemsTitle.textContent = "Items";
        itemsCount.textContent = "0";
        itemsContainer.innerHTML =
          '<div class="empty">Select a service to view its items</div>';
        return;
      }

      if (isDaysChild(selectedChild)) {
        renderDaysItems(selectedChild);
        return;
      }

      if (normalizeName(selectedChild.name) === "balance") {
        renderDirectBalance(selectedChild);
        return;
      }

      renderPackageItems(selectedChild);
    }

    function extractBalancePrice(response) {
      const candidates = [
        response?.price,
        response?.final_price,
        response?.total_price,
        response?.data?.price,
        response?.data?.final_price,
        response?.data?.total_price,
        response?.result?.price,
        response?.result?.final_price,
        response?.result?.total_price,
      ];

      for (const value of candidates) {
        const price = toNumber(value, Number.NaN);
        if (Number.isFinite(price)) return price;
      }
      return null;
    }

    async function getDirectBalancePrice(item, balanceAmount) {
      const response = await apiRequest(API_PATHS.BALANCE_PRICE, {
        method: "POST",
        body: {
          company: item.company || state.currentSubcategory?.name,
          balance_amount: balanceAmount,
          currency: state.selectedCurrency,
        },
      });

      const price = extractBalancePrice(response);
      if (price === null) {
        throw new Error(response.message || "Price was not returned by the server");
      }
      return price;
    }

    async function updateDirectBalancePrice(itemId) {
      const item = state.balanceItems.find((entry) => String(entry.id) === String(itemId));
      const amountInput = document.getElementById(`balance-amount-${itemId}`);
      const priceBox = document.getElementById(`balance-price-${itemId}`);
      if (!item || !priceBox) return;

      const balanceAmount = toNumber(amountInput?.value, Number.NaN);
      const requestId = (balancePriceRequestIds.get(String(itemId)) || 0) + 1;
      balancePriceRequestIds.set(String(itemId), requestId);
      balancePricesByItemId.delete(String(itemId));

      if (!Number.isFinite(balanceAmount) || balanceAmount <= 0) {
        priceBox.textContent = `0 ${state.selectedCurrency}`;
        return;
      }

      priceBox.textContent = "Calculating...";
      try {
        const price = await getDirectBalancePrice(item, balanceAmount);
        if (balancePriceRequestIds.get(String(itemId)) !== requestId) return;
        balancePricesByItemId.set(String(itemId), { balanceAmount, price });
        priceBox.textContent = `${formatNumber(price)} ${state.selectedCurrency}`;
      } catch (error) {
        if (balancePriceRequestIds.get(String(itemId)) !== requestId) return;
        priceBox.textContent = error.message || "Unable to calculate price";
      }
    }

    async function submitDirectBalance(event, itemId) {
      event.preventDefault();
      const item = state.balanceItems.find((entry) => String(entry.id) === String(itemId));
      const phoneInput = document.getElementById(`balance-phone-${itemId}`);
      const amountInput = document.getElementById(`balance-amount-${itemId}`);
      const priceBox = document.getElementById(`balance-price-${itemId}`);
      const button = document.getElementById(`balance-submit-${itemId}`);
      const message = document.getElementById(`balance-message-${itemId}`);
      const targetIdentifier = String(phoneInput?.value ?? "").trim();
      const balanceAmount = toNumber(amountInput?.value, Number.NaN);

      message.className = "package-order-message";
      message.textContent = "";

      if (!item || !targetIdentifier) {
        message.classList.add("error");
        message.textContent = "Phone number is required";
        phoneInput?.focus();
        return;
      }
      if (!Number.isFinite(balanceAmount) || balanceAmount <= 0) {
        message.classList.add("error");
        message.textContent = "Enter a valid balance amount";
        amountInput?.focus();
        return;
      }

      button.disabled = true;
      button.textContent = "Checking price...";

      try {
        let priceData = balancePricesByItemId.get(String(itemId));
        if (!priceData || priceData.balanceAmount !== balanceAmount) {
          const price = await getDirectBalancePrice(item, balanceAmount);
          priceData = { balanceAmount, price };
          balancePricesByItemId.set(String(itemId), priceData);
          priceBox.textContent = `${formatNumber(price)} ${state.selectedCurrency}`;
        }

        const confirmed = window.confirm(
          `Confirm ${formatNumber(balanceAmount)}$ balance for ${targetIdentifier} at ${formatNumber(priceData.price)} ${state.selectedCurrency}?`
        );
        if (!confirmed) return;

        button.textContent = "Sending...";
        const result = await apiRequest(API_PATHS.CREATE_ORDER, {
          method: "POST",
          body: {
            item_id: item.id,
            item_type: "BALANCE",
            target_identifier: targetIdentifier,
            balance_amount: balanceAmount,
            currency: state.selectedCurrency,
          },
        });

        message.classList.add("success");
        message.textContent = result.message || "Order created successfully";
        phoneInput.value = "";
        amountInput.value = "";
        balancePricesByItemId.delete(String(itemId));
        priceBox.textContent = `0 ${state.selectedCurrency}`;
      } catch (error) {
        message.classList.add("error");
        message.textContent = error.message || "Failed to create order";
      } finally {
        button.disabled = false;
        button.textContent = "Send Order";
      }
    }

    function renderDirectBalance(selectedChild) {
      const item = getVisibleBalanceItems()[0];
      itemsTitle.textContent = `${formatName(selectedChild.name)} Order`;
      itemsCount.textContent = item ? "1" : "0";
      itemsContainer.className = "balance-direct-container";

      if (!item) {
        itemsContainer.innerHTML = '<div class="empty">No balance service is available</div>';
        return;
      }

      itemsContainer.innerHTML = `
        <form class="balance-direct-card" onsubmit="submitDirectBalance(event, '${escapeJsString(item.id)}')">

    function unwrapYearResponse(response) {
      if (Array.isArray(response)) return response[0] || {};
      if (Array.isArray(response?.data)) return response.data[0] || {};
      if (response?.data?.year && typeof response.data.year === "object") return response.data.year;
      if (response?.data && typeof response.data === "object") return response.data;
      if (response?.year && typeof response.year === "object") return response.year;
      if (Array.isArray(response?.result)) return response.result[0] || {};
      if (response?.result && typeof response.result === "object") return response.result;
      return response || {};
    }

    function normalizeYearResponse(response, inputText = "") {
      const data = unwrapYearResponse(response);

      const splitValues = String(data.split_text ?? "")
        .split(",")
        .map((value) => value.trim())
        .filter((value) => value !== "");

      const responseNumbers = Array.isArray(data.numbers)
        ? data.numbers
        : [];

      const numbers = responseNumbers
        .map((entry, index) => ({
          index: index + 1,
          numberphone: String(
            entry?.numberphone ?? entry?.number ?? ""
          ).trim(),
          balance_before: toNumber(entry?.balance_before),
          balance_after: toNumber(entry?.balance_after),
          balance_difference: toNumber(
            entry?.balance_difference,
            toNumber(entry?.balance_after) -
              toNumber(entry?.balance_before)
          ),
          returned_amount: toNumber(splitValues[index]),
        }))
        .filter((entry) => entry.numberphone !== "");

      const rechargeCard =
        data.recharge_card && typeof data.recharge_card === "object"
          ? data.recharge_card
          : {};

      return {
        raw: data,
        year_id: data.year_id ?? data.id ?? null,
        number_client: data.number_client ?? inputText,
        buyer_numberphone:
          data.buyer_numberphone ??
          data.bayer_numberphone ??
          inputText,
        year_name: data.year_name ?? "-",
        status: String(data.status ?? "").trim().toUpperCase(),
        split_text: String(data.split_text ?? ""),
        source_group_id:
          data.source_group_id ?? data.group_id ?? null,
        full_card_price: toNumber(data.full_card_price),
        currency: String(data.currency ?? "LBP"),
        balance_before: toNumber(data.balance_before),
        balance_after: toNumber(data.balance_after),
        min_balance_lbp: toNumber(data.min_balance_lbp),
        total_received: toNumber(
          data.total_received ?? data.totalReceived
        ),
        final_year_price: toNumber(
          data.final_year_price ?? data.finalYearPrice
        ),
        refund_amount: toNumber(
          data.refund_amount ?? data.refundAmount
        ),
        numbers,
        recharge_card: {
          id: rechargeCard.id ?? null,
          company: String(rechargeCard.company ?? "-"),
          quantity_balance: toNumber(
            rechargeCard.quantity_balance
          ),
          validity_days: toNumber(rechargeCard.validity_days),
          secret_code: String(
            rechargeCard.secret_code ?? ""
          ).trim(),
          serial_number: String(
            rechargeCard.serial_number ??
            rechargeCard.serial ??
            ""
          ).trim(),
        },
      };
    }

    async function copyTextToClipboard(text) {
      if (!text) {
        throw new Error("There is no text to copy.");
      }

      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      const copied = document.execCommand("copy");
      textarea.remove();

      if (!copied) {
        throw new Error("Copy failed.");
      }
    }

    function mergeCheckedNumbers(originalNumbers, checkedNumbers) {
      if (!checkedNumbers.length) return originalNumbers;

      return checkedNumbers.map((checked, index) => {
        const original =
          originalNumbers.find(
            (entry) =>
              String(entry.numberphone) ===
              String(checked.numberphone)
          ) || originalNumbers[index] || {};

        return {
          ...original,
          ...checked,
          returned_amount:
            checked.returned_amount ||
            original.returned_amount ||
            0,
        };
      });
    }

    async function checkYear(itemId) {
      const item = state.daysItems.find(
        (entry) => String(entry.id) === String(itemId)
      );
      const saved = yearResultsByItemId.get(String(itemId));
      const button = document.getElementById(
        `check-year-button-${itemId}`
      );

      if (!item || !saved?.year) {
        showItemMessage(
          itemId,
          "Get a year before running Check.",
          "error"
        );
        return;
      }

      const requestBody = {
        year_id: saved.year.year_id,
        year_name: saved.year.year_name,
      };

      if (saved.year.source_group_id !== null) {
        requestBody.source_group_id =
          saved.year.source_group_id;
      }

      button.disabled = true;
      button.textContent = "Checking...";
      showItemMessage(itemId, "Checking balances...", "info");

      try {
        const response = await apiRequest(API_PATHS.CHECK_YEAR, {
          method: "POST",
          body: requestBody,
        });

        const checked = normalizeYearResponse(
          response,
          saved.inputText
        );

        const merged = {
          ...saved.year,
          ...checked,
          year_id:
            checked.year_id ?? saved.year.year_id,
          number_client:
            checked.number_client || saved.year.number_client,
          buyer_numberphone:
            checked.buyer_numberphone ||
            saved.year.buyer_numberphone,
          year_name:
            checked.year_name === "-"
              ? saved.year.year_name
              : checked.year_name,
          status:
            checked.status ||
            "CHECKING",
          split_text:
            checked.split_text || saved.year.split_text,
          source_group_id:
            checked.source_group_id ??
            saved.year.source_group_id,
          full_card_price:
            checked.full_card_price ||
            saved.year.full_card_price,
          currency:
            checked.currency || saved.year.currency,
          recharge_card:
            checked.recharge_card?.secret_code
              ? checked.recharge_card
              : saved.year.recharge_card,
          numbers: mergeCheckedNumbers(
            saved.year.numbers,
            checked.numbers
          ),
        };

        yearResultsByItemId.set(String(itemId), {
          inputText: saved.inputText,
          year: merged,
        });

        document.getElementById(
          `year-result-${itemId}`
        ).innerHTML = renderYearResult(item, merged);

        showItemMessage(
          itemId,
          response.message ||
            "Year balances checked successfully.",
          "success"
        );
      } catch (error) {
        showItemMessage(itemId, error.message, "error");
      } finally {
        const refreshedButton = document.getElementById(
          `check-year-button-${itemId}`
        );

        if (refreshedButton) {
          refreshedButton.disabled = false;
          refreshedButton.textContent = "Check";
        }
      }
    }

    async function confirmYear(itemId) {
      const item = state.daysItems.find(
        (entry) => String(entry.id) === String(itemId)
      );
      const saved = yearResultsByItemId.get(String(itemId));
      const checkbox = document.getElementById(
        `confirm-year-checkbox-${itemId}`
      );
      const button = document.getElementById(
        `confirm-year-button-${itemId}`
      );

      if (!item || !saved?.year) {
        showItemMessage(
          itemId,
          "Get and check a year before confirmation.",
          "error"
        );
        return;
      }

      if (saved.year.status !== "CHECKING") {
        showItemMessage(
          itemId,
          "Year status must be CHECKING before confirmation.",
          "error"
        );
        return;
      }

      if (!saved.year.year_id || !saved.year.number_client) {
        showItemMessage(
          itemId,
          "Year ID or client number is missing.",
          "error"
        );
        return;
      }

      if (!checkbox?.checked) {
        showItemMessage(
          itemId,
          "Tick the confirmation checkbox first.",
          "error"
        );
        return;
      }

      const accepted = window.confirm(
        "Are you sure you want to confirm this year? " +
        "This action cannot be undone."
      );

      if (!accepted) return;

      button.disabled = true;
      button.textContent = "Confirming...";
      showItemMessage(
        itemId,
        "Confirming the year and updating the client wallet...",
        "info"
      );

      try {
        const response = await apiRequest(
          API_PATHS.CONFIRM_YEAR,
          {
            method: "POST",
            body: {
              year_id: saved.year.year_id,
              number_client: saved.year.number_client,
            },
          }
        );

        const confirmedYear =
          response?.year && typeof response.year === "object"
            ? response.year
            : response?.data && typeof response.data === "object"
              ? response.data
              : {};

        const calculation =
          response?.calculation &&
          typeof response.calculation === "object"
            ? response.calculation
            : {};

        const balance =
          response?.balance &&
          typeof response.balance === "object"
            ? response.balance
            : {};

        const merged = {
          ...saved.year,
          ...confirmedYear,
          year_id:
            confirmedYear.id ??
            confirmedYear.year_id ??
            saved.year.year_id,
          number_client:
            confirmedYear.number_client ??
            saved.year.number_client,
          status: String(
            confirmedYear.status ?? "COMPLETE"
          ).toUpperCase(),
          final_year_price: toNumber(
            confirmedYear.final_year_price ??
            calculation.final_year_price
          ),
          refund_amount: toNumber(
            confirmedYear.refund_amount ??
            calculation.refund_amount
          ),
          balance_before: toNumber(
            balance.balance_before ??
            saved.year.balance_before
          ),
          balance_after: toNumber(
            balance.balance_after ??
            saved.year.balance_after
          ),
        };

        yearResultsByItemId.set(String(itemId), {
          inputText: saved.inputText,
          year: merged,
        });

        document.getElementById(
          `year-result-${itemId}`
        ).innerHTML = renderYearResult(item, merged);

        showItemMessage(
          itemId,
          response.message ||
            "Year confirmed and client wallet updated successfully.",
          "success"
        );
      } catch (error) {
        showItemMessage(itemId, error.message, "error");

        const currentButton = document.getElementById(
          `confirm-year-button-${itemId}`
        );

        if (currentButton) {
          currentButton.disabled = false;
          currentButton.textContent = "Confirm Year";
        }
      }
    }

    function clearYearResult(itemId) {
      yearResultsByItemId.delete(String(itemId));

      const result = document.getElementById(
        `year-result-${itemId}`
      );
      const input = document.getElementById(
        `year-input-${itemId}`
      );

      if (result) result.innerHTML = "";
      if (input) input.value = "";
      hideItemMessage(itemId);
    }

    function showItemMessage(itemId, message, type = "info") {
      const box = document.getElementById(`message-${itemId}`);
      if (!box) return;
      box.className = `item-message ${type}`;
      box.textContent = message;
    }

    function hideItemMessage(itemId) {
      const box = document.getElementById(`message-${itemId}`);
      if (!box) return;
      box.className = "hidden";
      box.textContent = "";
    }

    async function reloadDaysItems() {
      state.daysItemsLoaded = false;
      state.daysItemsError = "";
      renderItems();

      try {
        await loadAllItemsDays();
      } catch (error) {
        console.error("Items Days error:", error);
      }

      renderItems();
    }

    function buildSubcategoriesUrl() {
      return "./home.html";
    }

    async function loadPage() {
      if (!categoryId || !subcategoryId) {
        window.location.href = "./home.html";
        return;
      }

      const backUrl = buildSubcategoriesUrl();
      backButton.addEventListener("click", function () {
        window.location.href = backUrl;
      });
      categoryBackLink.href = backUrl;

      try {
        const [categories, packageItems, counterItems, balanceItems] = await Promise.all([
          getCategoriesTree(),
          getAllItemsPackage(),
          getAllItemsCounter(),
          getAllItemsBalance(),
        ]);

        const category = categories.find(
          (item) => String(item.id) === String(categoryId)
        );

        const subcategory = category?.subcategories?.find(
          (item) => String(item.id) === String(subcategoryId)
        );

        if (!category || !subcategory || subcategory.is_active === false) {
          throw new Error(
            "The selected subcategory was not found"
          );
        }

        state.currentCategory = category;
        state.currentSubcategory = subcategory;
        state.children = Array.isArray(
          subcategory.childcategories
        )
          ? subcategory.childcategories.filter(
              (child) => child.is_active !== false
            )
          : [];
        state.packageItems = packageItems;
        state.counterItems = counterItems;
        state.balanceItems = balanceItems;
        state.selectedChildcategoryId = state.children.some(
          (child) => String(child.id) === String(selectedChildIdFromUrl)
        )
          ? selectedChildIdFromUrl
          : state.children[0]?.id ?? null;

        const categoryName = formatName(
          category.name || categoryNameFromUrl
        );
        const subcategoryName = formatName(
          subcategory.name || subcategoryNameFromUrl
        );

        pageTitle.textContent = subcategoryName;
        categoryBackLink.textContent = categoryName;
        breadcrumbSubcategory.textContent = subcategoryName;

        renderChildren();
        renderItems();

        loading.classList.add("hidden");
        page.classList.remove("hidden");

        const selectedChild = getSelectedChild();

        if (selectedChild && isDaysChild(selectedChild)) {
          try {
            await loadAllItemsDays();
          } catch (error) {
            console.error("Items Days error:", error);
          }

          renderItems();
        }
      } catch (error) {
        console.error("Child categories error:", error);
        loading.classList.add("hidden");
        page.classList.remove("hidden");
        pageError.textContent =
          error.message || "Unable to load services";
        pageError.classList.remove("hidden");
      }
    }

    currencyButtons.forEach((button) => {
      button.addEventListener("click", () => {
        selectCurrency(button.dataset.currency);
      });
    });
    syncCurrencyButtons();
    loadPage();
  </script>
  <script type="module" src="./firebase-notifications.js"></script>
  <script src="./theme.js"></script>
</body>
</html>
