<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f97316">
  <title>Login</title>
  <link rel="stylesheet" href="./theme.css">
  <style>
    * { box-sizing: border-box; }
    :root { --orange:#f97316; --dark:#c2410c; --ink:#171717; --muted:#737373; --line:#e7e5e4; }
    body {
      margin:0; min-height:100vh; color:var(--ink);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
      background:radial-gradient(circle at 8% 12%,rgba(251,146,60,.3),transparent 30%),
        radial-gradient(circle at 92% 88%,rgba(253,186,116,.28),transparent 32%),#fffaf7;
    }
    .page { display:grid; min-height:100vh; place-items:center; padding:28px 18px; }
    .shell {
      display:grid; width:min(100%,960px); min-height:590px; overflow:hidden;
      grid-template-columns:.92fr 1.08fr; border:1px solid rgba(255,255,255,.85);
      border-radius:30px; background:rgba(255,255,255,.95);
      box-shadow:0 28px 80px rgba(124,45,18,.16); backdrop-filter:blur(16px);
    }
    .welcome {
      position:relative; display:flex; overflow:hidden; flex-direction:column;
      justify-content:space-between; padding:48px 42px; color:#fff;
      background:linear-gradient(145deg,#fb923c 0%,#f97316 48%,#c2410c 100%);
    }
    .welcome::after { position:absolute; right:-90px; bottom:-90px; width:280px; height:280px;
      content:""; border:46px solid rgba(255,255,255,.09); border-radius:50%; }
    .brand { position:relative; z-index:1; display:flex; align-items:center; gap:12px; font-weight:800; }
    .brand-mark { display:grid; width:42px; height:42px; place-items:center; border:1px solid rgba(255,255,255,.4);
      border-radius:14px; background:rgba(255,255,255,.17); font-size:20px; }
    .welcome-copy { position:relative; z-index:1; }
    .welcome h2 { max-width:330px; margin:0 0 16px; font-size:clamp(34px,4vw,50px); line-height:1.04; letter-spacing:-.045em; }
    .welcome p { max-width:330px; margin:0; color:rgba(255,255,255,.82); font-size:15px; line-height:1.7; }
    .login-panel { display:flex; flex-direction:column; justify-content:center; padding:54px 64px; }
    .eyebrow { margin:0 0 9px; color:var(--dark); font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(30px,4vw,42px); line-height:1.12; letter-spacing:-.04em; }
    .subtitle { margin:11px 0 30px; color:var(--muted); font-size:15px; }
    .form-group { margin-bottom:19px; }
    label { display:block; margin-bottom:8px; font-size:13px; font-weight:700; }
    .input-wrap { position:relative; }
    .icon { position:absolute; top:50%; left:16px; width:20px; color:#a8a29e; transform:translateY(-50%); pointer-events:none; }
    .input { width:100%; height:54px; padding:0 16px 0 48px; border:1px solid var(--line); outline:0;
      border-radius:15px; color:var(--ink); background:#fafafa; font:inherit; transition:.2s; }
    .input::placeholder { color:#a8a29e; }
    .input:focus { border-color:var(--orange); background:#fff; box-shadow:0 0 0 4px rgba(249,115,22,.12); }
    .password-input { padding-right:76px; }
    .toggle { position:absolute; top:50%; right:8px; padding:9px 10px; border:0; border-radius:10px;
      color:var(--dark); background:transparent; font:inherit; font-size:12px; font-weight:800; cursor:pointer; transform:translateY(-50%); }
    .button { display:flex; width:100%; height:54px; align-items:center; justify-content:center; gap:9px; margin-top:7px;
      border:0; border-radius:15px; color:#fff; background:linear-gradient(135deg,#fb923c,#ea580c);
      box-shadow:0 12px 24px rgba(234,88,12,.24); font:inherit; font-weight:800; cursor:pointer; transition:.2s; }
    .button:hover { transform:translateY(-2px); box-shadow:0 16px 30px rgba(234,88,12,.3); }
    .button:disabled { cursor:wait; opacity:.68; transform:none; }
    .spinner { display:none; width:18px; height:18px; border:2px solid rgba(255,255,255,.45); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; }
    .button.loading .spinner { display:block; } @keyframes spin { to { transform:rotate(360deg); } }
    .message { display:none; margin-top:14px; padding:12px 14px; border-radius:12px; font-size:13px; line-height:1.45; }
    .message.error { display:block; color:#dc2626; background:#fef2f2; }
    .message.success { display:block; color:#15803d; background:#f0fdf4; }
    .divider { display:flex; align-items:center; gap:12px; margin:25px 0 19px; color:#a8a29e; font-size:12px; }
    .divider::before,.divider::after { height:1px; flex:1; content:""; background:var(--line); }
    .links { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .links a { display:flex; min-height:46px; align-items:center; justify-content:center; padding:10px; border:1px solid var(--line);
      border-radius:13px; color:#44403c; background:#fff; font-size:13px; font-weight:750; text-align:center; text-decoration:none; transition:.2s; }
    .links a:hover { border-color:#fdba74; color:var(--dark); background:#fff7ed; }
    @media(max-width:760px) { .page{padding:16px}.shell{min-height:auto;grid-template-columns:1fr;border-radius:24px}
      .welcome{min-height:170px;padding:28px}.welcome h2{max-width:none;margin-top:34px;font-size:31px}.welcome p{display:none}.login-panel{padding:34px 26px 30px} }
    @media(max-width:420px) { .links{grid-template-columns:1fr}.welcome{min-height:150px}.login-panel{padding:30px 20px 24px} }
  </style>
</head>
<body>
  <main class="page">
    <section class="shell">
      <aside class="welcome">
        <div class="brand"><span class="brand-mark">A</span><span>ABD Services</span></div>
        <div class="welcome-copy">
          <h2>Everything you need, in one place.</h2>
          <p>Access your balance, services, orders and account activity quickly and securely.</p>
        </div>
      </aside>
      <section class="login-panel">
        <p class="eyebrow">Welcome back</p>
        <h1>Sign in</h1>
        <p class="subtitle">Enter your phone number and password to continue.</p>
        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="numberphone">Phone number</label>
            <div class="input-wrap">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.69 2.8a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.33 1.85.56 2.81.69A2 2 0 0 1 22 16.92z"/></svg>
              <input class="input" id="numberphone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="70 123 456" required autofocus>
            </div>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrap">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input class="input password-input" id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
              <button class="toggle" id="passwordToggle" type="button" aria-label="Show password">Show</button>
            </div>
          </div>
          <button class="button" id="loginButton" type="submit"><span class="spinner"></span><span id="loginButtonText">Sign in</span><span>→</span></button>
          <div class="message" id="message" role="alert" aria-live="polite"></div>
        </form>
        <div class="divider">or continue with</div>
        <div class="links"><a href="./otp-login.html">Login with OTP</a><a href="./register.html">Create account</a></div>
      </section>
    </section>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
  <script src="./firebase-client.js"></script>
  <script>
    const API_BASE_URL="https://abdd-production.up.railway.app";
    const loginForm=document.getElementById("loginForm"),numberphoneInput=document.getElementById("numberphone"),
      passwordInput=document.getElementById("password"),loginButton=document.getElementById("loginButton"),
      loginButtonText=document.getElementById("loginButtonText"),passwordToggle=document.getElementById("passwordToggle"),
      messageElement=document.getElementById("message");
    function normalizeNumberphone(value){return String(value??"").trim().replace(/\s+/g,"").replace(/-/g,"")}
    function showMessage(message,type){messageElement.textContent=message;messageElement.className=`message ${type}`}
    function clearMessage(){messageElement.textContent="";messageElement.className="message"}
    function setLoading(value){loginButton.disabled=value;loginButton.classList.toggle("loading",value);loginButtonText.textContent=value?"Signing in...":"Sign in"}
    function saveLoginData(token,user){localStorage.setItem("token",token);if(user)localStorage.setItem("user",JSON.stringify(user))}
    passwordToggle.addEventListener("click",()=>{const hidden=passwordInput.type==="password";passwordInput.type=hidden?"text":"password";passwordToggle.textContent=hidden?"Hide":"Show"});
    loginForm.addEventListener("submit",async event=>{
      event.preventDefault();const fcmPermissionPromise=prepareFcmPermission();clearMessage();const numberphone=normalizeNumberphone(numberphoneInput.value),password=passwordInput.value;
      if(!numberphone){showMessage("Phone number is required","error");numberphoneInput.focus();return}
      if(!password){showMessage("Password is required","error");passwordInput.focus();return}
      setLoading(true);
      try{const response=await fetch(`${API_BASE_URL}/auth/login/password`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({numberphone,password})});
        let data={};try{data=await response.json()}catch(parseError){}
        if(!response.ok||data.success===false)throw new Error(data.message||"Login failed");
        if(!data.token)throw new Error("Token was not returned by server");
        saveLoginData(data.token,data.data);showMessage(data.message||"Login successful","success");await saveFcmTokenAfterAuth(data.token,fcmPermissionPromise);window.location.href="./home.html";
      }catch(error){console.error("Login error:",error);showMessage(error.message||"Unable to connect to server","error")}finally{setLoading(false)}
    });
  </script>
  <script src="./theme.js"></script>
</body>
</html>
