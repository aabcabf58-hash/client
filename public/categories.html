<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Categories</title>
  <link rel="stylesheet" href="./site.css">

  <style>
    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
      max-width: 950px;
      margin: 34px auto 0;
    }

    .category-card {
      min-height: 230px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 28px;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }

    .category-card:hover {
      transform: translateY(-5px);
      border-color: #4d9cff;
    }

    .category-icon {
      width: 86px;
      height: 86px;
      display: grid;
      place-items: center;
      color: #d9ebff;
      background: var(--card-soft);
      border: 1px solid var(--border);
      border-radius: 22px;
      font-size: 36px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .category-name {
      font-size: 23px;
      font-weight: 800;
      text-align: center;
      text-transform: capitalize;
    }

    .category-arrow {
      color: #7db5ff;
      font-weight: 700;
    }

    @media (max-width: 800px) {
      .category-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .category-grid {
        grid-template-columns: 1fr;
      }

      .category-card {
        min-height: 190px;
      }
    }
  </style>
  <style>
    :root {
      color-scheme: light;
      --bg: #edf0f3;
      --background: #edf0f3;
      --card: #f8fafc;
      --card-soft: #eef1f4;
      --text: #293241;
      --muted: #6b7280;
      --border: #cdd3db;
      --shadow: 0 12px 32px rgba(31, 41, 55, 0.08);
    }

    html,
    body {
      min-height: 100%;
      height: auto !important;
      overflow-x: hidden;
      overflow-y: auto !important;
    }

    body {
      margin: 0;
      background: var(--bg) !important;
      color: var(--text) !important;
    }

    .page {
      width: min(calc(100% - 32px), 1280px) !important;
      max-width: 1280px !important;
      min-height: 0 !important;
      height: auto !important;
      max-height: none !important;
      overflow: visible !important;
      margin: 0 auto !important;
      padding: 24px 0 48px !important;
      box-sizing: border-box;
    }

    .topbar {
      min-height: 84px;
      padding: 18px 20px !important;
    }

    .topbar h1 {
      font-size: clamp(24px, 3vw, 32px);
    }

    .navbar {
      min-height: 52px;
      padding: 6px !important;
      gap: 6px;
    }

    .nav-link {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    .topbar,
    .navbar,
    .panel,
    .category-card,
    .summary-card,
    .category-grid {
      background: var(--card) !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
    }

    .nav-link.active {
      background: #dfe3e8 !important;
      color: #1f2937 !important;
    }

    .button:not(.secondary),
    .logout-button {
      background: #4b5563 !important;
      color: #fff !important;
      border-color: #4b5563 !important;
    }

    .button.secondary,
    .status,
    .badge,
    .message,
    .count,
    .category-icon {
      background: #e4e8ed !important;
      color: #374151 !important;
      border-color: var(--border) !important;
    }

    a,
    .nav-link,
    .category-arrow {
      color: #4b5563 !important;
    }

    input,
    select,
    textarea,
    .search-input,
    .filter-input,
    .input {
      background: #f3f5f7 !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
    }

    main,
    section,
    .panel,
    .category-grid {
      max-height: none !important;
      overflow-y: visible !important;
    }

    .category-grid {
      width: 100% !important;
      max-width: none !important;
    }

    @media (max-width: 640px) {
      .page {
        width: calc(100% - 20px) !important;
        padding: 12px 0 32px !important;
      }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">Loading categories...</div>

  <main id="page" class="page hidden">
    <header class="topbar">
      <div>
        <h1>Categories</h1>
        <p>Choose the category you want to open.</p>
      </div>

      <div class="topbar-actions">
        <button id="logoutButton" class="button logout-button" type="button">
          Logout
        </button>
      </div>
    </header>

    <nav class="navbar">
      <a class="nav-link" href="./home.html">Home</a>
      <a class="nav-link active" href="./categories.html">Categories</a>
      <a class="nav-link" href="./years.html">Years</a>
      <a class="nav-link" href="./activity.html">Activity</a>
    </nav>

    <div id="pageError" class="error-box hidden"></div>
    <section id="categoriesContainer" class="category-grid"></section>
  </main>

  <script>
    const API_BASE_URL =
      "https://abdd-production.up.railway.app";

    const loading = document.getElementById("loading");
    const page = document.getElementById("page");
    const pageError = document.getElementById("pageError");
    const categoriesContainer =
      document.getElementById("categoriesContainer");
    const logoutButton =
      document.getElementById("logoutButton");

    function getToken() {
      return localStorage.getItem("token");
    }

    function logout() {
      localStorage.removeItem("token");
      localStorage.removeItem("user");
      window.location.href = "./login.html";
    }

    function formatName(value) {
      return String(value ?? "")
        .replace(/_/g, " ")
        .trim();
    }

    function firstLetter(value) {
      const text = formatName(value);
      return text ? text.charAt(0).toUpperCase() : "?";
    }

    async function getCategoriesTree() {
      const token = getToken();

      if (!token) {
        logout();
        throw new Error("Token not found");
      }

      const response = await fetch(
        `${API_BASE_URL}/category/getAllCategoriesTree`,
        {
          method: "GET",
          headers: {
            Authorization: `Bearer ${token}`,
          },
        }
      );

      let result = {};

      try {
        result = await response.json();
      } catch (error) {
        console.error("Invalid JSON response:", error);
      }

      if (response.status === 401 || response.status === 403) {
        logout();
        throw new Error(result.message || "Session expired");
      }

      if (!response.ok || result.success === false) {
        throw new Error(result.message || "Failed to get categories");
      }

      return Array.isArray(result.data) ? result.data : [];
    }

    function openCategory(category) {
      const params = new URLSearchParams({
        category_id: category.id,
        category_name: category.name,
      });

      window.location.href =
        `./subcategories.html?${params.toString()}`;
    }

    function renderCategories(categories) {
      categoriesContainer.innerHTML = "";

      const activeCategories = categories.filter(
        (category) => category.is_active !== false
      );

      if (activeCategories.length === 0) {
        categoriesContainer.innerHTML =
          '<div class="empty">No categories available</div>';
        return;
      }

      for (const category of activeCategories) {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "category-card";

        const icon = document.createElement("div");
        icon.className = "category-icon";
        icon.textContent = firstLetter(category.name);

        const name = document.createElement("div");
        name.className = "category-name";
        name.textContent = formatName(category.name);

        const arrow = document.createElement("div");
        arrow.className = "category-arrow";
        arrow.textContent = "Open →";

        card.appendChild(icon);
        card.appendChild(name);
        card.appendChild(arrow);
        card.addEventListener("click", () => openCategory(category));

        categoriesContainer.appendChild(card);
      }
    }

    async function loadPage() {
      try {
        const categories = await getCategoriesTree();
        renderCategories(categories);

        loading.classList.add("hidden");
        page.classList.remove("hidden");
      } catch (error) {
        console.error("Categories error:", error);
        loading.classList.add("hidden");
        page.classList.remove("hidden");
        pageError.textContent =
          error.message || "Unable to load categories";
        pageError.classList.remove("hidden");
      }
    }

    logoutButton.addEventListener("click", logout);
    loadPage();
  </script>
</body>
</html>
