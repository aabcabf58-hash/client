<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Create Account</title>
  <link rel="stylesheet" href="./auth.css">
  <link rel="stylesheet" href="./theme.css">
  <style>
    :root {
      color-scheme: light;
      --bg: #fff7f0;
      --background: #fff7f0;
      --card: #ffffff;
      --text: #2d1b12;
      --muted: #806354;
      --border: #edc7ae;
      --shadow: 0 12px 32px rgba(127, 44, 0, 0.10);
    }

    html,
    body {
      min-height: 100%;
      height: auto !important;
      overflow-x: hidden;
      overflow-y: auto !important;
    }

    body {
      margin: 0;
      background: var(--bg) !important;
      color: var(--text) !important;
    }

    main.page {
      width: 100% !important;
      min-height: 100vh !important;
      height: auto !important;
      max-height: none !important;
      overflow: visible !important;
      padding: 24px !important;
      box-sizing: border-box;
      display: grid;
      place-items: center;
    }

    .card {
      width: min(100%, 460px) !important;
      max-width: 460px !important;
      background: var(--card) !important;
      color: var(--text) !important;
      border: 1px solid var(--border) !important;
      box-shadow: var(--shadow) !important;
    }

    input,
    select,
    textarea,
    .input {
      background: #fffaf6 !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
    }

    .button:not(.secondary) {
      background: #a63a00 !important;
      color: #fff !important;
      border-color: #a63a00 !important;
    }

    .button.secondary,
    .message,
    .otp-number {
      background: #fff0e3 !important;
      color: #7f2c00 !important;
      border-color: var(--border) !important;
    }

    a {
      color: #a63a00 !important;
    }

    @media (max-width: 640px) {
      main.page {
        padding: 16px !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <h1>Create Account</h1>
      <p class="subtitle">Enter your details, then verify the OTP.</p>

      <form id="registerForm">
        <div class="form-group">
          <label for="nameUser">Full Name</label>
          <input
            class="input"
            id="nameUser"
            type="text"
            autocomplete="name"
            placeholder="Your name"
            required
          >
        </div>

        <div class="form-group">
          <label for="numberphone">Phone Number</label>
          <input
            class="input"
            id="numberphone"
            type="tel"
            inputmode="numeric"
            autocomplete="tel"
            placeholder="70123456"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <div class="password-wrapper">
            <input
              class="input"
              id="password"
              type="password"
              autocomplete="new-password"
              placeholder="Create a password"
              required
            >

            <button
              class="text-button password-toggle"
              id="passwordToggle"
              type="button"
            >
              Show
            </button>
          </div>
        </div>

        <button class="button" id="requestButton" type="submit">
          Register and Send OTP
        </button>
      </form>

      <form class="hidden" id="verifyForm" hidden>
        <div class="otp-number" id="selectedNumber"></div>

        <div class="form-group">
          <label for="otp">OTP Code</label>
          <input
            class="input"
            id="otp"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            placeholder="Enter OTP"
            required
          >
        </div>

        <button class="button" id="verifyButton" type="submit">
          Verify and Create Account
        </button>

        <button class="button secondary" id="editDataButton" type="button">
          Edit Registration Data
        </button>
      </form>

      <div class="message" id="message"></div>

      <div class="links">
        <a href="./login.html">Password Login</a>
        <a href="./otp-login.html">OTP Login</a>
      </div>
    </section>
  </main>

  <script>
    const API_BASE_URL =
      "https://abdd-production.up.railway.app";

    const registerForm =
      document.getElementById("registerForm");

    const verifyForm =
      document.getElementById("verifyForm");

    const nameUserInput =
      document.getElementById("nameUser");

    const numberphoneInput =
      document.getElementById("numberphone");

    const passwordInput =
      document.getElementById("password");

    const otpInput =
      document.getElementById("otp");

    const requestButton =
      document.getElementById("requestButton");

    const verifyButton =
      document.getElementById("verifyButton");

    const editDataButton =
      document.getElementById("editDataButton");

    const passwordToggle =
      document.getElementById("passwordToggle");

    const selectedNumber =
      document.getElementById("selectedNumber");

    const messageElement =
      document.getElementById("message");

    let pendingNumberphone = "";

    function normalizeNumberphone(value) {
      return String(value ?? "")
        .trim()
        .replace(/\s+/g, "")
        .replace(/-/g, "");
    }

    function showMessage(message, type) {
      messageElement.textContent = message;
      messageElement.className = `message ${type}`;
    }

    function clearMessage() {
      messageElement.textContent = "";
      messageElement.className = "message";
    }

    function showVerifyStep(numberphone) {
      pendingNumberphone = numberphone;
      selectedNumber.textContent =
        `OTP sent to ${numberphone}`;

      registerForm.classList.add("hidden");
      verifyForm.classList.remove("hidden");
      registerForm.hidden = true;
      verifyForm.hidden = false;
      otpInput.focus();
    }

    function showRegisterStep() {
      pendingNumberphone = "";
      otpInput.value = "";
      verifyForm.classList.add("hidden");
      registerForm.classList.remove("hidden");
      verifyForm.hidden = true;
      registerForm.hidden = false;
      clearMessage();
    }

    passwordToggle.addEventListener(
      "click",
      function () {
        const isHidden =
          passwordInput.type === "password";

        passwordInput.type =
          isHidden ? "text" : "password";

        passwordToggle.textContent =
          isHidden ? "Hide" : "Show";
      }
    );

    registerForm.addEventListener(
      "submit",
      async function (event) {
        event.preventDefault();
        clearMessage();

        const name_user =
          String(nameUserInput.value ?? "").trim();

        const numberphone =
          normalizeNumberphone(numberphoneInput.value);

        const password = passwordInput.value;

        if (!name_user) {
          showMessage(
            "Name is required",
            "error"
          );
          return;
        }

        if (!numberphone) {
          showMessage(
            "Phone number is required",
            "error"
          );
          return;
        }

        if (!password) {
          showMessage(
            "Password is required",
            "error"
          );
          return;
        }

        requestButton.disabled = true;
        requestButton.textContent = "Sending...";

        try {
          const response = await fetch(
            `${API_BASE_URL}/auth/register/request-otp`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                name_user,
                password,
                numberphone,
              }),
            }
          );

          const data = await response.json();

          if (!response.ok || data.success === false) {
            throw new Error(
              data.message ||
                "Registration request failed"
            );
          }

          showMessage(
            data.message ||
              "Register OTP created successfully",
            "success"
          );

          showVerifyStep(numberphone);
        } catch (error) {
          console.error(
            "Request register OTP error:",
            error
          );

          showMessage(
            error.message ||
              "Unable to connect to server",
            "error"
          );
        } finally {
          requestButton.disabled = false;
          requestButton.textContent =
            "Register and Send OTP";
        }
      }
    );

    verifyForm.addEventListener(
      "submit",
      async function (event) {
        event.preventDefault();
        clearMessage();

        const otp = String(otpInput.value ?? "")
          .trim();

        if (!pendingNumberphone) {
          showRegisterStep();
          return;
        }

        if (!otp) {
          showMessage(
            "OTP is required",
            "error"
          );
          return;
        }

        verifyButton.disabled = true;
        verifyButton.textContent = "Verifying...";

        try {
          const response = await fetch(
            `${API_BASE_URL}/auth/register/verify-otp`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                numberphone: pendingNumberphone,
                otp,
                fcm_token: null,
              }),
            }
          );

          const data = await response.json();

          if (!response.ok || data.success === false) {
            throw new Error(
              data.message ||
                "Registration verification failed"
            );
          }

          if (!data.token) {
            throw new Error(
              "Token was not returned by server"
            );
          }

          localStorage.setItem(
            "token",
            data.token
          );

          if (data.user) {
            localStorage.setItem(
              "user",
              JSON.stringify(data.user)
            );
          }

          window.location.href = "./home.html";
        } catch (error) {
          console.error(
            "Verify register OTP error:",
            error
          );

          showMessage(
            error.message ||
              "Unable to verify registration",
            "error"
          );
        } finally {
          verifyButton.disabled = false;
          verifyButton.textContent =
            "Verify and Create Account";
        }
      }
    );

    editDataButton.addEventListener(
      "click",
      showRegisterStep
    );
  </script>
  <script src="./theme.js"></script>
</body>
</html>
