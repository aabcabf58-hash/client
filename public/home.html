<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Categories</title>
  <link rel="stylesheet" href="./site.css">
  <link rel="stylesheet" href="./theme.css">

  <style>
    :root {
      color-scheme: light;
      --bg: #dff5ff;
      --background: #dff5ff;
      --card: #ffffff;
      --card-soft: #eef9ff;
      --text: #17324a;
      --muted: #627d91;
      --border: #bddcec;
      --primary: #a63a00;
      --primary-dark: #7f2c00;
      --primary-soft: #e0f2fe;
      --shadow: 0 12px 30px rgba(36, 105, 143, 0.10);
    }

    * { box-sizing: border-box; }

    html,
    body {
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      background:
        linear-gradient(180deg, #bfe8ff 0%, #e8f8ff 100%),
        var(--bg) !important;
      color: var(--text) !important;
    }

    .page {
      width: min(calc(100% - 32px), 1280px) !important;
      margin: 0 auto !important;
      padding: 24px 0 48px !important;
    }

    .topbar {
      display: flex;
      flex-wrap: nowrap !important;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 116px;
      padding: 20px 22px !important;
      background: rgba(255, 255, 255, 0.94) !important;
      color: var(--text) !important;
      border: 1px solid var(--border) !important;
      border-radius: 22px;
      box-shadow: var(--shadow);
    }

    .welcome-block {
      min-width: 0;
      flex: 0 1 220px;
    }

    .topbar h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 32px);
    }

    .topbar p {
      margin: 5px 0 0;
      color: var(--muted);
    }

    .header-summary {
      display: flex;
      align-items: stretch;
      justify-content: flex-end;
      flex-wrap: nowrap;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .summary-chip {
      min-width: 0;
      flex: 1 1 145px;
      padding: 11px 14px;
      background: #f4fbff;
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .summary-chip.role-chip {
      min-width: 0;
      flex-basis: 112px;
      background: var(--primary-soft);
    }

    .chip-label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .chip-value {
      color: var(--text);
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .icon-link,
    .logout-button {
      min-width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      text-decoration: none;
      cursor: pointer;
    }

    .icon-link {
      color: var(--primary-dark) !important;
      background: var(--primary-soft) !important;
      border: 1px solid var(--border) !important;
      font-size: 18px;
    }

    #notificationButton {
      padding: 0;
      font: inherit;
    }

    #notificationButton.notification-enabled {
      box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.18);
    }

    #notificationButton.notification-blocked {
      opacity: 0.68;
    }

    .logout-button {
      padding: 0 14px;
      color: #fff !important;
      background: var(--primary) !important;
      border: 1px solid var(--primary) !important;
      font-weight: 800;
    }

    .logout-button:hover { background: var(--primary-dark) !important; }

    .catalog-sections {
      display: flex;
      flex-direction: column;
      gap: 32px;
      margin-top: 30px;
      background: transparent !important;
      border: 0 !important;
      box-shadow: none !important;
    }

    .category-section {
      width: 100%;
      overflow: hidden;
      background: transparent !important;
      border: 0 !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
    }

    .category-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 17px;
      color: var(--text);
      font-size: 24px;
      font-weight: 900;
      text-transform: capitalize;
    }

    .category-heading::before {
      content: "";
      width: 5px;
      height: 25px;
      flex: 0 0 auto;
      background: var(--primary);
      border-radius: 999px;
    }

    .subcategory-grid {
      display: flex !important;
      flex-wrap: nowrap !important;
      align-items: flex-start;
      gap: 16px;
      width: 100%;
      padding: 2px 2px 10px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: thin;
      scroll-snap-type: x proximity;
      background: transparent !important;
      background-color: transparent !important;
      background-image: none !important;
      border: 0 !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
    }

    .subcategory-card {
      flex: 0 0 112px;
      width: 112px;
      min-width: 112px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      padding: 0;
      color: var(--text);
      background: transparent;
      border: 0;
      cursor: pointer;
      font: inherit;
      scroll-snap-align: start;
    }

    .subcategory-image {
      width: 112px;
      max-width: none;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      padding: 12px;
      object-fit: contain;
      color: var(--primary-dark);
      background: #ffffff;
      border: 1px solid #f0dfd4;
      border-radius: 22px;
      box-shadow: 0 8px 20px rgba(90, 43, 18, .07);
      font-size: 30px;
      font-weight: 900;
      text-transform: uppercase;
      transition: transform .18s ease, border-color .18s ease,
        box-shadow .18s ease;
    }

    .subcategory-card:hover .subcategory-image {
      transform: translateY(-3px);
      border-color: var(--primary);
      box-shadow: 0 11px 23px rgba(127, 44, 0, .13);
    }

    .subcategory-name {
      width: 100%;
      min-height: 36px;
      display: -webkit-box;
      overflow: hidden;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
      text-transform: capitalize;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .category-empty {
      padding: 13px 15px;
      color: var(--muted);
      background: #f4fbff;
      border: 1px dashed var(--border);
      border-radius: 14px;
      font-size: 13px;
    }

    .error-box,
    .empty {
      padding: 18px;
      color: var(--primary-dark);
      background: #eef9ff;
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .hidden { display: none !important; }

    @media (min-width: 1200px) {
      .subcategory-card { flex-basis: 120px; width: 120px; min-width: 120px; }
      .subcategory-image { width: 120px; }
    }

    @media (max-width: 900px) {
      .topbar { align-items: center; flex-wrap: nowrap !important; gap: 10px; }
      .header-summary { justify-content: flex-end; order: initial; flex-basis: auto; gap: 6px; }
      .summary-chip { padding: 8px; }
      .chip-label { font-size: 9px; }
      .chip-value { font-size: 12px; }
    }

    @media (max-width: 640px) {
      .page {
        width: calc(100% - 20px) !important;
        padding: 12px 0 32px !important;
      }

      .topbar { padding: 10px !important; border-radius: 17px; gap: 6px; }
      .welcome-block { flex: 0 1 86px; }
      .topbar h1 { overflow: hidden; font-size: 16px; text-overflow: ellipsis; white-space: nowrap; }
      .topbar p { overflow: hidden; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
      .header-summary { display: flex; grid-template-columns: none; gap: 4px; }
      .summary-chip { min-width: 0; padding: 6px 5px; border-radius: 10px; }
      .role-chip { grid-column: auto; }
      .chip-label { margin-bottom: 2px; font-size: 7px; letter-spacing: 0; }
      .chip-value { display: block; overflow: hidden; font-size: 9px; text-overflow: ellipsis; }
      .topbar-actions { gap: 4px; }
      .icon-link, .logout-button, .home-sidebar-open { min-width: 34px; width: 34px; height: 34px; flex-basis: 34px; }
      .logout-button { width: 42px; padding: 0; font-size: 0; }
      .logout-button::before { content: "↪"; font-size: 20px; }
      .catalog-sections { gap: 27px; margin-top: 24px; }
      .category-heading { margin-bottom: 13px; font-size: 20px; }
      .subcategory-grid {
        gap: 10px;
        padding-bottom: 8px;
      }
      .subcategory-card {
        flex-basis: 78px;
        width: 78px;
        min-width: 78px;
      }
      .subcategory-image {
        width: 78px;
        max-width: none;
        padding: 8px;
        border-radius: 17px;
        font-size: 22px;
      }
      .subcategory-name { min-height: 31px; font-size: 12px; }
    }
  </style>
  <style>
    .home-sidebar-toggle {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .home-sidebar {
      position: fixed;
      top: 14px;
      bottom: 14px;
      left: 14px;
      z-index: 1200;
      width: 176px;
      padding: 16px 11px;
      color: var(--text);
      background: rgba(255, 255, 255, .98);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 15px 38px rgba(127, 44, 0, .13);
      transition: transform .22s ease;
      display: flex;
      flex-direction: column;
    }

    .home-sidebar-title {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 2px 5px 16px;
      color: var(--primary-dark);
      font-size: 16px;
      font-weight: 900;
    }

    .home-sidebar-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--primary);
      border-radius: 11px;
    }

    .home-sidebar-links {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .home-sidebar-logout {
      width: 100%;
      min-height: 44px;
      margin-top: auto;
      padding: 8px 10px;
      border: 1px solid rgba(248, 113, 113, .35);
      border-radius: 12px;
      color: #fecaca;
      background: rgba(127, 29, 29, .22);
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .home-sidebar-logout:hover { background: rgba(127, 29, 29, .38); }

    .home-sidebar-link {
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      color: #5f4436 !important;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 12px;
      text-decoration: none !important;
      font-size: 13px;
      font-weight: 800;
    }

    .home-sidebar-link:hover {
      color: var(--primary-dark) !important;
      background: var(--card-soft);
    }

    .home-sidebar-link.active {
      color: #fff !important;
      background: var(--primary);
      border-color: var(--primary);
    }

    .home-sidebar-icon {
      width: 24px;
      flex: 0 0 24px;
      text-align: center;
      font-size: 18px;
    }

    .home-sidebar-overlay,
    .home-sidebar-open {
      display: none;
    }

    @media (min-width: 901px) {
      body {
        box-sizing: border-box;
        padding-left: 204px !important;
      }
    }

    @media (max-width: 900px) {
      .home-sidebar {
        top: 10px;
        bottom: 10px;
        left: 10px;
        width: min(78vw, 260px);
        transform: translateX(calc(-100% - 24px));
      }

      .home-sidebar-overlay {
        position: fixed;
        inset: 0;
        z-index: 1190;
        display: block;
        visibility: hidden;
        background: rgba(45, 27, 18, .30);
        opacity: 0;
        cursor: pointer;
        transition: opacity .2s ease, visibility .2s ease;
      }

      .home-sidebar-toggle:checked + .home-sidebar {
        transform: translateX(0);
      }

      .home-sidebar-toggle:checked ~ .home-sidebar-overlay {
        visibility: visible;
        opacity: 1;
      }

      .home-sidebar-open {
        width: 42px;
        height: 42px;
        display: inline-grid;
        flex: 0 0 42px;
        place-items: center;
        color: var(--primary-dark);
        background: var(--primary-soft);
        border: 1px solid var(--border);
        border-radius: 12px;
        cursor: pointer;
        font-size: 21px;
        font-weight: 900;
      }
    }
  </style>
</head>
<body>
  <input
    id="homeSidebarToggle"
    class="home-sidebar-toggle"
    type="checkbox"
    aria-hidden="true"
  >

  <aside class="home-sidebar" aria-label="Main navigation">
    <div class="home-sidebar-title">
      <span class="home-sidebar-mark">A</span>
      <span>Menu</span>
    </div>

    <nav class="home-sidebar-links">
      <a class="home-sidebar-link active" href="./home.html" aria-current="page">
        <span class="home-sidebar-icon" aria-hidden="true">▦</span>
        <span>Categories</span>
      </a>
      <a class="home-sidebar-link" href="./activity.html">
        <span class="home-sidebar-icon" aria-hidden="true">↕</span>
        <span>Activity</span>
      </a>
      <a class="home-sidebar-link" href="./years.html">
        <span class="home-sidebar-icon" aria-hidden="true">◷</span>
        <span>My Years</span>
      </a>
    </nav>

    <button id="logoutButton" class="home-sidebar-logout" type="button">
      ↪ Logout
    </button>
  </aside>

  <label
    class="home-sidebar-overlay"
    for="homeSidebarToggle"
    aria-label="Close menu"
  ></label>

  <div id="loading" class="loading">Loading...</div>

  <main id="page" class="page hidden">
    <header class="topbar">
      <div class="welcome-block">
        <h1 id="welcomeName">Welcome</h1>
        <p id="numberphoneText"></p>
      </div>

      <div class="header-summary">
        <div class="summary-chip">
          <span class="chip-label">LBP Balance</span>
          <span id="balanceLbp" class="chip-value">0 LBP</span>
        </div>
        <div class="summary-chip">
          <span class="chip-label">USD Balance</span>
          <span id="balanceUsd" class="chip-value">0 USD</span>
        </div>
        <div class="summary-chip role-chip">
          <span class="chip-label">Role</span>
          <span id="accountRole" class="chip-value">Client</span>
        </div>
      </div>

      <div class="topbar-actions">
        <label
          class="home-sidebar-open"
          for="homeSidebarToggle"
          title="Open menu"
          aria-label="Open menu"
        >☰</label>
        <button
          id="notificationButton"
          class="icon-link"
          type="button"
          title="Enable notifications"
          aria-label="Enable notifications"
        >🔔</button>
        <a class="icon-link" href="./years.html" title="Years" aria-label="Years">📅</a>
        <a class="icon-link" href="./activity.html" title="Activity" aria-label="Activity">🧾</a>
      </div>
    </header>

    <div id="pageError" class="error-box hidden"></div>

    <section id="catalogContainer" class="catalog-sections"></section>
  </main>

  <script>
    const API_BASE_URL = "https://abdd-production.up.railway.app";

    const loading = document.getElementById("loading");
    const page = document.getElementById("page");
    const pageError = document.getElementById("pageError");
    const welcomeName = document.getElementById("welcomeName");
    const numberphoneText = document.getElementById("numberphoneText");
    const accountRole = document.getElementById("accountRole");
    const balanceLbp = document.getElementById("balanceLbp");
    const balanceUsd = document.getElementById("balanceUsd");
    const catalogContainer = document.getElementById("catalogContainer");
    const logoutButton = document.getElementById("logoutButton");

    function getToken() {
      return localStorage.getItem("token");
    }

    function logout() {
      localStorage.removeItem("token");
      localStorage.removeItem("user");
      window.location.href = "./login.html";
    }

    function formatNumber(value) {
      const number = Number(value);
      return Number.isFinite(number)
        ? new Intl.NumberFormat("en-GB", { maximumFractionDigits: 2 }).format(number)
        : "0";
    }

    function formatName(value) {
      return String(value ?? "").replace(/_/g, " ").trim();
    }

    function firstLetter(value) {
      const text = formatName(value);
      return text ? text.charAt(0).toUpperCase() : "?";
    }

    async function requestJson(path, options = {}) {
      const requiresAuth = options.auth !== false;
      const token = getToken();
      if (requiresAuth && !token) {
        logout();
        throw new Error("Token not found");
      }

      const response = await fetch(`${API_BASE_URL}${path}`, {
        headers: requiresAuth && token
          ? { Authorization: `Bearer ${token}` }
          : {},
      });

      let result = {};
      try { result = await response.json(); } catch (_) {}

      if (requiresAuth && response.status === 401) {
        logout();
        throw new Error(result.message || "Session expired");
      }

      if (!response.ok || result.success === false) {
        throw new Error(result.message || "Request failed");
      }

      return result;
    }

    async function getInfoUser() {
      const result = await requestJson("/auth/getInfoUser");
      if (!result.user) throw new Error("User information was not found");
      return result.user;
    }

    async function getCategoriesTree() {
      const result = await requestJson(
        "/category/getAllCategoriesTree",
        { auth: false }
      );
      if (Array.isArray(result)) return result;
      if (Array.isArray(result.data)) return result.data;
      if (Array.isArray(result.categories)) return result.categories;
      if (Array.isArray(result.tree)) return result.tree;
      return [];
    }

    function renderUser(user) {
      const name = user.name_user || "Customer";
      welcomeName.textContent = `Welcome, ${name}`;
      numberphoneText.textContent = user.numberphone || "";
      accountRole.textContent = user.role || "client";
      balanceLbp.textContent = `${formatNumber(user.balance_lbp)} LBP`;
      balanceUsd.textContent = `${formatNumber(user.balance_usd)} USD`;
      localStorage.setItem("user", JSON.stringify(user));
    }

    function openSubcategory(category, subcategory) {
      const params = new URLSearchParams({
        category_id: category.id,
        category_name: category.name,
        subcategory_id: subcategory.id,
        subcategory_name: subcategory.name,
      });
      window.location.href = `./childcategories.html?${params.toString()}`;
    }

    function renderCategories(categories) {
      catalogContainer.innerHTML = "";
      const activeCategories = categories.filter((item) => item.is_active !== false);

      if (!activeCategories.length) {
        catalogContainer.innerHTML = '<div class="empty">No categories available</div>';
        return;
      }

      for (const category of activeCategories) {
        const section = document.createElement("section");
        section.className = "category-section";

        const heading = document.createElement("h2");
        heading.className = "category-heading";
        heading.textContent = formatName(category.name);
        section.appendChild(heading);

        const subcategoryGrid = document.createElement("div");
        subcategoryGrid.className = "subcategory-grid";
        const subcategories = Array.isArray(category.subcategories)
          ? category.subcategories.filter((item) => item.is_active !== false)
          : [];

        if (!subcategories.length) {
          subcategoryGrid.innerHTML =
            '<div class="category-empty">No subcategories available</div>';
        }

        for (const subcategory of subcategories) {
          const card = document.createElement("button");
          card.type = "button";
          card.className = "subcategory-card";

          let image;
          if (subcategory.image_url) {
            image = document.createElement("img");
            image.src = subcategory.image_url;
            image.alt = formatName(subcategory.name);
          } else {
            image = document.createElement("div");
            image.textContent = firstLetter(subcategory.name);
          }
          image.className = "subcategory-image";

          const name = document.createElement("div");
          name.className = "subcategory-name";
          name.textContent = formatName(subcategory.name);

          card.appendChild(image);
          card.appendChild(name);
          card.addEventListener(
            "click",
            () => openSubcategory(category, subcategory)
          );
          subcategoryGrid.appendChild(card);
        }

        section.appendChild(subcategoryGrid);
        catalogContainer.appendChild(section);
      }
    }

    async function loadPage() {
      try {
        try {
          const user = await getInfoUser();
          renderUser(user);
        } catch (userError) {
          console.error("User information error:", userError);
          const savedUser = localStorage.getItem("user");
          if (savedUser) {
            try {
              renderUser(JSON.parse(savedUser));
            } catch (_) {}
          }
        }

        try {
          const categories = await getCategoriesTree();
          renderCategories(categories);
        } catch (catalogError) {
          console.error("Categories error:", catalogError);
          catalogContainer.innerHTML =
            `<div class="empty">${catalogError.message || "Unable to load categories"}</div>`;
        }
      } catch (error) {
        console.error("Home error:", error);
        pageError.textContent = error.message || "Unable to load the home page";
        pageError.classList.remove("hidden");
      } finally {
        loading.classList.add("hidden");
        page.classList.remove("hidden");
      }
    }

    logoutButton.addEventListener("click", logout);
    loadPage();
  </script>
  <script type="module" src="./firebase-notifications.js"></script>
  <script src="./theme.js"></script>
</body>
</html>
