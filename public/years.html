<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>My Years</title>
  <link rel="stylesheet" href="./site.css">
  <link rel="stylesheet" href="./theme.css">
  <style>
    .years-toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1.5fr) repeat(2, minmax(150px, 0.6fr));
      gap: 12px;
      padding: 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .filter-field { display: grid; gap: 7px; }
    .filter-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .filter-input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 13px;
      color: var(--text);
      background: var(--card-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      font: inherit;
    }

    .filter-input:focus {
      border-color: #4d9cff;
      box-shadow: 0 0 0 3px rgba(77, 156, 255, 0.13);
    }

    .custom-dates {
      display: grid;
      grid-template-columns: repeat(2, minmax(140px, 1fr));
      gap: 12px;
      grid-column: 1 / -1;
    }

    .years-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 18px 0;
    }

    .summary-card,
    .year-card,
    .year-info-box,
    .year-number {
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    .summary-card { padding: 15px; }
    .summary-label,
    .info-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .summary-value { margin-top: 5px; font-size: 23px; font-weight: 900; }

    .years-list { display: grid; gap: 17px; }
    .year-card { padding: 19px; box-shadow: var(--shadow); }
    .year-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 15px;
    }
    .year-title { margin: 0; font-size: 22px; font-weight: 900; }
    .year-subtitle { margin-top: 5px; color: var(--muted); font-size: 12px; }

    .status {
      padding: 7px 11px;
      border: 1px solid;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 900;
    }
    .status-created { color: #dbeafe; background: #2563eb22; border-color: #60a5fa66; }
    .status-pending { color: #fef3c7; background: #d9770622; border-color: #f59e0b66; }
    .status-checking { color: #e0f2fe; background: #0369a122; border-color: #38bdf866; }
    .status-complete { color: #dcfce7; background: #16a34a22; border-color: #4ade8066; }

    .year-info-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .year-info-box { padding: 12px; background: var(--card-soft); border-radius: 13px; }
    .info-value { margin-top: 5px; overflow-wrap: anywhere; font-size: 15px; font-weight: 900; }

    .numbers-title { margin: 17px 0 10px; font-size: 14px; font-weight: 900; }
    .numbers-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .year-number { padding: 13px; background: var(--card-soft); border-radius: 14px; }
    .numberphone {
      margin: 5px 0 9px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 17px;
      font-weight: 900;
    }
    .number-details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      color: var(--muted);
      font-size: 11px;
    }
    .number-details strong { display: block; margin-top: 2px; color: var(--text); font-size: 13px; }

    .year-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
    .year-button {
      min-height: 43px;
      padding: 10px 16px;
      color: #fff;
      background: #059669;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font: inherit;
      font-weight: 900;
    }
    .year-button.confirm { background: #d97706; }
    .year-button:disabled { cursor: not-allowed; opacity: 0.5; }

    .confirm-area {
      flex: 1 1 100%;
      padding: 13px;
      background: rgba(217, 119, 6, 0.10);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 14px;
    }
    .confirm-label {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.5;
    }
    .confirm-label input { width: 18px; height: 18px; flex: 0 0 auto; accent-color: #d97706; }
    .confirm-area .year-button { margin-top: 10px; width: 100%; }

    .year-message { margin-top: 12px; padding: 11px; border-radius: 12px; font-size: 12px; }
    .year-message.info { color: #dbeafe; background: #2563eb22; border: 1px solid #60a5fa55; }
    .year-message.error { color: #fee2e2; background: #dc262622; border: 1px solid #f8717155; }
    .year-message.success { color: #dcfce7; background: #16a34a22; border: 1px solid #4ade8055; }
    .empty-years { padding: 55px 18px; text-align: center; color: var(--muted); background: var(--card); border: 1px solid var(--border); border-radius: 18px; }

    @media (max-width: 850px) {
      .years-toolbar { grid-template-columns: 1fr 1fr; }
      .filter-field:first-child { grid-column: 1 / -1; }
      .years-summary, .year-info-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 580px) {
      .years-toolbar, .custom-dates, .numbers-grid { grid-template-columns: 1fr; }
      .filter-field:first-child, .custom-dates { grid-column: auto; }
      .years-summary, .year-info-grid { grid-template-columns: 1fr 1fr; }
      .year-head { align-items: stretch; }
    }

    /* Compact years rows - always one row, even on small screens */
    .years-list {
      gap: 8px;
      overflow-x: auto !important;
      overflow-y: visible !important;
      padding-bottom: 6px;
    }

    .years-row-head,
    .year-row {
      display: grid;
      grid-template-columns: minmax(150px, 1.1fr) minmax(140px, 1fr) minmax(165px, 1fr) minmax(110px, 0.65fr);
      align-items: center;
      gap: 12px;
      min-width: 600px;
    }

    .years-row-head {
      padding: 0 14px 7px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .year-row {
      min-height: 58px;
      padding: 10px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 5px 16px rgba(127, 44, 0, 0.06);
      box-sizing: border-box;
    }

    .year-row-cell {
      min-width: 0;
    }

    .year-row-value {
      min-width: 0;
      color: var(--text);
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .year-row-price {
      font-size: 15px;
    }

    .year-row-status {
      justify-self: start;
      white-space: nowrap;
    }

    /* لا نحول السطر إلى عمود أو سطرين على الموبايل، فقط نصغّر الخط والمسافات */
    @media (max-width: 720px) {
      .years-row-head,
      .year-row {
        grid-template-columns: minmax(135px, 1.1fr) minmax(125px, 1fr) minmax(150px, 1fr) minmax(95px, 0.65fr);
        gap: 8px;
        min-width: 535px;
      }

      .years-row-head {
        padding: 0 10px 6px;
        font-size: 9px;
      }

      .year-row {
        min-height: 52px;
        padding: 8px 10px;
      }

      .year-row-value {
        font-size: 12px;
      }

      .year-row-price {
        font-size: 13px;
      }

      .year-row-status {
        font-size: 10px;
        padding: 6px 8px;
      }
    }

    @media (max-width: 430px) {
      .years-row-head,
      .year-row {
        grid-template-columns: minmax(125px, 1.1fr) minmax(115px, 1fr) minmax(140px, 1fr) minmax(90px, 0.65fr);
        min-width: 500px;
      }

      .year-row-value {
        font-size: 11px;
      }

      .year-row-price {
        font-size: 12px;
      }

      .year-row-status {
        font-size: 9px;
      }
    }


    /* Year details modal */
    .year-row {
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .year-row:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(127, 44, 0, 0.10);
    }

    .year-row:focus-visible {
      outline: 3px solid rgba(166, 58, 0, 0.22);
      outline-offset: 2px;
    }

    body.year-modal-open {
      overflow: hidden !important;
    }

    .year-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(22, 14, 10, 0.58);
      backdrop-filter: blur(4px);
      box-sizing: border-box;
    }

    .year-modal-overlay.hidden {
      display: none !important;
    }

    .year-modal {
      width: min(960px, 100%);
      max-height: calc(100vh - 36px);
      overflow: auto;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.26);
    }

    .year-modal-header {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }

    .year-modal-title {
      margin: 0;
      font-size: 20px;
      font-weight: 900;
    }

    .year-modal-close {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card-soft);
      color: var(--text);
      cursor: pointer;
      font-size: 20px;
      font-weight: 900;
    }

    .year-modal-body {
      padding: 18px;
    }

    .year-modal-info {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .year-modal-info-box {
      min-width: 0;
      padding: 12px;
      background: var(--card-soft);
      border: 1px solid var(--border);
      border-radius: 13px;
    }

    .year-modal-info-value {
      margin-top: 5px;
      font-size: 14px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .year-modal-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 4px 0 10px;
    }

    .year-modal-section-title {
      margin: 0;
      font-size: 15px;
      font-weight: 900;
    }

    .copy-numbers-button {
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card-soft);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 900;
    }

    .year-numbers-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .year-numbers-table {
      width: 100%;
      min-width: 540px;
      border-collapse: collapse;
      table-layout: auto;
      background: var(--card);
    }

    .year-numbers-table th,
    .year-numbers-table td {
      padding: 8px 7px;
      text-align: left;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }

    .year-numbers-table th {
      color: var(--muted);
      background: var(--card-soft);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .year-numbers-table td {
      font-size: 12px;
      font-weight: 800;
    }

    .year-numbers-table th:first-child,
    .year-numbers-table td:first-child {
      width: 105px;
    }

    .year-numbers-table th:nth-child(2),
    .year-numbers-table td:nth-child(2) {
      width: 105px;
    }

    .year-numbers-table th:nth-child(3),
    .year-numbers-table td:nth-child(3),
    .year-numbers-table th:nth-child(4),
    .year-numbers-table td:nth-child(4),
    .year-numbers-table th:nth-child(5),
    .year-numbers-table td:nth-child(5) {
      width: 75px;
    }

    .year-numbers-table tr:last-child td {
      border-bottom: 0;
    }

    .year-number-cell {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 900 !important;
    }

    .year-modal-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .year-modal-actions .year-button {
      min-width: 130px;
    }

    .year-modal-confirm {
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      background: rgba(217, 119, 6, 0.10);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 14px;
      box-sizing: border-box;
    }

    .year-modal-confirm .year-button {
      width: 100%;
      margin-top: 10px;
    }

    @media (max-width: 700px) {
      .year-modal-overlay {
        padding: 10px;
        align-items: flex-end;
      }

      .year-modal {
        width: 100%;
        max-height: 92vh;
        border-radius: 18px 18px 12px 12px;
      }

      .year-modal-header,
      .year-modal-body {
        padding-left: 12px;
        padding-right: 12px;
      }

      .year-modal-info {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .year-modal-title {
        font-size: 17px;
      }
    }
  </style>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff7f0;
      --background: #fff7f0;
      --card: #ffffff;
      --card-soft: #fff0e3;
      --text: #2d1b12;
      --muted: #806354;
      --border: #edc7ae;
      --shadow: 0 12px 32px rgba(127, 44, 0, 0.10);
    }

    html,
    body {
      min-height: 100%;
      height: auto !important;
      overflow-x: hidden;
      overflow-y: auto !important;
    }

    body {
      margin: 0;
      background: var(--bg) !important;
      color: var(--text) !important;
    }

    .page {
      width: min(calc(100% - 32px), 1280px) !important;
      max-width: 1280px !important;
      min-height: 0 !important;
      height: auto !important;
      max-height: none !important;
      overflow: visible !important;
      margin: 0 auto !important;
      padding: 24px 0 48px !important;
      box-sizing: border-box;
    }

    .topbar {
      min-height: 84px;
      padding: 18px 20px !important;
    }

    .topbar h1 {
      font-size: clamp(24px, 3vw, 32px);
    }

    .navbar {
      min-height: 52px;
      padding: 6px !important;
      gap: 6px;
    }

    .nav-link {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    .topbar,
    .navbar,
    .panel,
    .year-card,
    .summary-card,
    .year-info-box,
    .year-number,
    .years-toolbar,
    .years-list {
      background: var(--card) !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
    }

    .nav-link.active {
      background: #ffe1cc !important;
      color: #7f2c00 !important;
    }

    .button:not(.secondary),
    .year-button,
    .logout-button {
      background: #a63a00 !important;
      color: #fff !important;
      border-color: #a63a00 !important;
    }

    .button.secondary,
    .status,
    .badge,
    .message,
    .year-message,
    .count {
      background: #fff0e3 !important;
      color: #7f2c00 !important;
      border-color: var(--border) !important;
    }

    a,
    .nav-link {
      color: #a63a00 !important;
    }

    input,
    select,
    textarea,
    .search-input,
    .filter-input,
    .input {
      background: #fffaf6 !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
    }

    main,
    section,
    .panel,
    .years-list,
    .years-toolbar {
      max-height: none !important;
      overflow-y: visible !important;
    }

    .years-list {
      width: 100% !important;
      max-width: none !important;
    }

    @media (max-width: 640px) {
      .page {
        width: calc(100% - 20px) !important;
        padding: 12px 0 32px !important;
      }
    }
  </style>

  <style>
    /* Fix scrolling inside year details on small screens.
       This must come after the generic section overflow rules. */
    .year-modal-overlay {
      overflow-y: auto !important;
      overscroll-behavior: contain;
    }

    section.year-modal {
      max-height: calc(100dvh - 36px) !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }

    @media (max-width: 700px) {
      .year-modal-overlay {
        padding: 6px !important;
        align-items: flex-end;
      }

      section.year-modal {
        width: 100% !important;
        height: calc(100dvh - 12px);
        max-height: calc(100dvh - 12px) !important;
        border-radius: 16px 16px 8px 8px;
      }

      .year-modal-header {
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .year-modal-body {
        padding-bottom: 28px;
      }
    }
  </style>

</head>
<body>
  <div id="loading" class="loading">Loading your years...</div>

  <main id="page" class="page hidden">
    <header class="topbar">
      <div>
        <h1>My Years</h1>
        <p>Track every requested year, balance check, final price, and refund.</p>
      </div>
      <div class="topbar-actions">
        <a class="button secondary" href="./home.html" title="Home" aria-label="Home">🏠</a>
        <button id="refreshButton" class="button secondary" type="button">Refresh</button>
      </div>
    </header>

    <div id="pageError" class="error-box hidden"></div>

    <section class="years-toolbar">
      <label class="filter-field">
        <span class="filter-label">Search numbers</span>
        <input id="searchInput" class="filter-input" type="search"
          placeholder="Target number or any returned-to number">
      </label>

      <label class="filter-field">
        <span class="filter-label">Status</span>
        <select id="statusFilter" class="filter-input">
          <option value="ALL">All statuses</option>
          <option value="CREATED">Created</option>
          <option value="PENDING">Pending</option>
          <option value="CHECKING">Checking</option>
          <option value="COMPLETE">Complete</option>
        </select>
      </label>

      <label class="filter-field">
        <span class="filter-label">Pending date</span>
        <select id="dateFilter" class="filter-input">
          <option value="ALL">All dates</option>
          <option value="TODAY">Today</option>
          <option value="YESTERDAY">Yesterday</option>
          <option value="7_DAYS">Last 7 days</option>
          <option value="30_DAYS">Last 30 days</option>
          <option value="CUSTOM">Custom range</option>
        </select>
      </label>

      <div id="customDates" class="custom-dates hidden">
        <label class="filter-field">
          <span class="filter-label">From</span>
          <input id="dateFrom" class="filter-input" type="date">
        </label>
        <label class="filter-field">
          <span class="filter-label">To</span>
          <input id="dateTo" class="filter-input" type="date">
        </label>
      </div>
    </section>

    <section class="years-summary">
      <article class="summary-card"><div class="summary-label">Visible</div><div id="visibleCount" class="summary-value">0</div></article>
      <article class="summary-card"><div class="summary-label">Pending</div><div id="pendingCount" class="summary-value">0</div></article>
      <article class="summary-card"><div class="summary-label">Checking</div><div id="checkingCount" class="summary-value">0</div></article>
      <article class="summary-card"><div class="summary-label">Complete</div><div id="completeCount" class="summary-value">0</div></article>
    </section>

    <section id="yearsList" class="years-list"></section>
  </main>

  <div id="yearModalOverlay" class="year-modal-overlay hidden" aria-hidden="true">
    <section id="yearModal" class="year-modal" role="dialog" aria-modal="true" aria-labelledby="yearModalTitle"></section>
  </div>

  <script>
    const API_BASE_URL = "https://abdd-production.up.railway.app";
    const API_PATHS = {
      GET_MY_YEARS: "/api/ushare/getMyYears",
      CHECK_YEAR: "/api/ushare/chekyear",
      CONFIRM_YEAR: "/api/ushare/confirmYear",
    };

    const state = {
      years: [],
      openYearId: null,
      modalMessage: null,
    };
    const loading = document.getElementById("loading");
    const page = document.getElementById("page");
    const pageError = document.getElementById("pageError");
    const yearsList = document.getElementById("yearsList");
    const searchInput = document.getElementById("searchInput");
    const statusFilter = document.getElementById("statusFilter");
    const dateFilter = document.getElementById("dateFilter");
    const customDates = document.getElementById("customDates");
    const dateFrom = document.getElementById("dateFrom");
    const dateTo = document.getElementById("dateTo");
    const yearModalOverlay = document.getElementById("yearModalOverlay");
    const yearModal = document.getElementById("yearModal");

    function getToken() { return localStorage.getItem("token"); }
    function logout() {
      localStorage.removeItem("token");
      localStorage.removeItem("user");
      window.location.href = "./login.html";
    }
    function escapeHtml(value) {
      return String(value ?? "").replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;").replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }
    function escapeJsString(value) {
      return String(value ?? "").replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'").replaceAll("\n", "\\n")
        .replaceAll("\r", "\\r");
    }
    function toNumber(value) {
      const number = Number(String(value ?? 0).replaceAll(",", "").trim());
      return Number.isFinite(number) ? number : 0;
    }
    function money(value) {
      return new Intl.NumberFormat("en-GB", { maximumFractionDigits: 2 })
        .format(toNumber(value));
    }
    function moneyOrDash(value) {
      if (value === null || value === undefined || String(value).trim() === "") return "—";
      return money(value);
    }
    function formatDate(value) {
      if (!value) return "—";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "—";
      return new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Beirut", year: "numeric", month: "short",
        day: "2-digit", hour: "2-digit", minute: "2-digit",
      }).format(date);
    }
    function startOfDay(date) {
      const result = new Date(date);
      result.setHours(0, 0, 0, 0);
      return result;
    }
    function endOfDay(date) {
      const result = new Date(date);
      result.setHours(23, 59, 59, 999);
      return result;
    }

    async function apiRequest(path, options = {}) {
      const token = getToken();
      if (!token) { logout(); throw new Error("Token not found"); }
      const response = await fetch(`${API_BASE_URL}${path}`, {
        method: options.method || "GET",
        headers: {
          Authorization: `Bearer ${token}`,
          ...(options.body !== undefined ? { "Content-Type": "application/json" } : {}),
        },
        body: options.body !== undefined ? JSON.stringify(options.body) : undefined,
      });
      const text = await response.text();
      let result = {};
      try { result = text ? JSON.parse(text) : {}; } catch { result = { raw: text }; }
      if (response.status === 401) { logout(); throw new Error(result.message || "Session expired"); }
      if (!response.ok || result.success === false) {
        throw new Error(result.message || result.error || `Server returned ${response.status}`);
      }
      return result;
    }

    function normalizeYear(year) {
      return {
        ...year,
        id: year.id ?? year.year_id,
        year_name: String(year.year_name ?? "-"),
        status: String(year.status ?? "").toUpperCase(),
        client_numberphone: String(year.client_numberphone ?? ""),
        target_identifier: String(year.target_identifier ?? ""),
        source_group_id: year.source_group_id ?? null,
        pending_at: year.pending_at ?? null,
        total_received: toNumber(year.total_received),
        total_balance_difference: toNumber(year.total_balance_difference),
        final_year_price: toNumber(year.final_year_price),
        price_sene_now: year.price_sene_now === null || year.price_sene_now === undefined
          ? null
          : toNumber(year.price_sene_now),
        refund_amount: toNumber(year.refund_amount),
        numbers: Array.isArray(year.numbers)
          ? year.numbers.map((entry) => ({
              ...entry,
              required_balance: entry.required_balance ?? null,
            }))
          : [],
      };
    }

    async function loadYears(showLoader = true) {
      if (showLoader) {
        loading.classList.remove("hidden");
        page.classList.add("hidden");
      }
      pageError.classList.add("hidden");
      try {
        const result = await apiRequest(API_PATHS.GET_MY_YEARS);
        state.years = (Array.isArray(result.data) ? result.data : [])
          .map(normalizeYear)
          .sort((a, b) => new Date(b.pending_at || 0) - new Date(a.pending_at || 0));
        renderYears();
        if (state.openYearId !== null) {
          renderYearModal(state.openYearId);
        }
        loading.classList.add("hidden");
        page.classList.remove("hidden");
      } catch (error) {
        loading.classList.add("hidden");
        page.classList.remove("hidden");
        pageError.textContent = error.message || "Unable to load years";
        pageError.classList.remove("hidden");
      }
    }

    function isInsideDateFilter(year) {
      const mode = dateFilter.value;
      if (mode === "ALL") return true;
      if (!year.pending_at) return false;
      const pending = new Date(year.pending_at);
      if (Number.isNaN(pending.getTime())) return false;
      const now = new Date();
      if (mode === "TODAY") return pending >= startOfDay(now) && pending <= endOfDay(now);
      if (mode === "YESTERDAY") {
        const yesterday = new Date(now);
        yesterday.setDate(yesterday.getDate() - 1);
        return pending >= startOfDay(yesterday) && pending <= endOfDay(yesterday);
      }
      if (mode === "7_DAYS" || mode === "30_DAYS") {
        const days = mode === "7_DAYS" ? 7 : 30;
        const from = startOfDay(now);
        from.setDate(from.getDate() - (days - 1));
        return pending >= from && pending <= endOfDay(now);
      }
      if (mode === "CUSTOM") {
        const from = dateFrom.value ? startOfDay(new Date(`${dateFrom.value}T00:00:00`)) : null;
        const to = dateTo.value ? endOfDay(new Date(`${dateTo.value}T00:00:00`)) : null;
        return (!from || pending >= from) && (!to || pending <= to);
      }
      return true;
    }

    function getVisibleYears() {
      const search = searchInput.value.trim().toLowerCase();
      return state.years.filter((year) => {
        if (statusFilter.value !== "ALL" && year.status !== statusFilter.value) return false;
        if (!isInsideDateFilter(year)) return false;
        if (!search) return true;
        const searchableNumbers = [
          year.target_identifier,
          ...year.numbers.map((entry) => entry.numberphone),
        ].join(" ").toLowerCase();
        return searchableNumbers.includes(search);
      });
    }

    function renderYears() {
      const visible = getVisibleYears();
      document.getElementById("visibleCount").textContent = visible.length;
      document.getElementById("pendingCount").textContent =
        visible.filter((year) => year.status === "PENDING").length;
      document.getElementById("checkingCount").textContent =
        visible.filter((year) => year.status === "CHECKING").length;
      document.getElementById("completeCount").textContent =
        visible.filter((year) => year.status === "COMPLETE").length;

      if (!visible.length) {
        yearsList.innerHTML = '<div class="empty-years">No years match the selected filters.</div>';
        return;
      }
      yearsList.innerHTML = `
        <div class="years-row-head" aria-hidden="true">
          <div>Final year price</div>
          <div>Target number</div>
          <div>Date</div>
          <div>Status</div>
        </div>
        ${visible.map(renderYearRow).join("")}
      `;
    }

    function renderYearRow(year) {
      const statusClass = `status-${year.status.toLowerCase()}`;

      return `
        <article
          class="year-row"
          id="year-${escapeHtml(year.id)}"
          data-year-id="${escapeHtml(year.id)}"
          role="button"
          tabindex="0"
          aria-label="Open year details"
          onclick="openYearDetails('${escapeJsString(year.id)}')"
          onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openYearDetails('${escapeJsString(year.id)}'); }"
        >
          <div class="year-row-cell price">
            <div class="year-row-value year-row-price">${escapeHtml(money(year.final_year_price))} LBP</div>
          </div>

          <div class="year-row-cell target">
            <div class="year-row-value">${escapeHtml(year.target_identifier || "—")}</div>
          </div>

          <div class="year-row-cell date">
            <div class="year-row-value">${escapeHtml(formatDate(year.pending_at))}</div>
          </div>

          <div class="year-row-cell state">
            <span class="status ${statusClass} year-row-status">${escapeHtml(year.status || "UNKNOWN")}</span>
          </div>
        </article>
      `;
    }

    function modalInfoBox(label, value) {
      return `
        <div class="year-modal-info-box">
          <div class="info-label">${escapeHtml(label)}</div>
          <div class="year-modal-info-value">${escapeHtml(value)}</div>
        </div>
      `;
    }

    function renderYearNumberRow(entry) {
      return `
        <tr>
          <td class="year-number-cell">${escapeHtml(entry.numberphone || "—")}</td>
          <td>${escapeHtml(moneyOrDash(entry.required_balance))}${entry.required_balance === null || entry.required_balance === undefined ? "" : "$"}</td>
          <td>${escapeHtml(moneyOrDash(entry.balance_before))}${entry.balance_before === null || entry.balance_before === undefined ? "" : "$"}</td>
          <td>${escapeHtml(moneyOrDash(entry.balance_after))}${entry.balance_after === null || entry.balance_after === undefined ? "" : "$"}</td>
          <td>${escapeHtml(moneyOrDash(entry.balance_difference))}${entry.balance_difference === null || entry.balance_difference === undefined ? "" : "$"}</td>
        </tr>
      `;
    }

    function openYearDetails(yearId) {
      state.openYearId = String(yearId);
      state.modalMessage = null;
      renderYearModal(yearId);
    }

    function closeYearDetails() {
      state.openYearId = null;
      state.modalMessage = null;
      yearModalOverlay.classList.add("hidden");
      yearModalOverlay.setAttribute("aria-hidden", "true");
      yearModal.innerHTML = "";
      document.body.classList.remove("year-modal-open");
    }

    function renderYearModal(yearId) {
      const year = state.years.find((entry) => String(entry.id) === String(yearId));

      if (!year) {
        closeYearDetails();
        return;
      }

      state.openYearId = String(year.id);

      const statusClass = `status-${year.status.toLowerCase()}`;
      const canCheck = year.status === "PENDING" || year.status === "CHECKING";
      const canConfirm = year.status === "CHECKING";

      const numbersRows = year.numbers.length
        ? year.numbers.map(renderYearNumberRow).join("")
        : `<tr><td colspan="5">No numbers were returned.</td></tr>`;

      const estimatedPrice = year.price_sene_now === null
        ? "—"
        : `${money(year.price_sene_now)} LBP`;

      const messageHtml = state.modalMessage && String(state.modalMessage.yearId) === String(year.id)
        ? `<div id="message-${escapeHtml(year.id)}" class="year-message ${escapeHtml(state.modalMessage.type)}">${escapeHtml(state.modalMessage.text)}</div>`
        : `<div id="message-${escapeHtml(year.id)}" class="hidden"></div>`;

      yearModal.innerHTML = `
        <div class="year-modal-header">
          <div>
            <h2 id="yearModalTitle" class="year-modal-title">${escapeHtml(year.year_name)} · #${escapeHtml(year.id)}</h2>
          </div>
          <button class="year-modal-close" type="button" onclick="closeYearDetails()" aria-label="Close">×</button>
        </div>

        <div class="year-modal-body">
          <div class="year-modal-info">
            ${modalInfoBox("Target number", year.target_identifier || "—")}
            ${modalInfoBox("Date", formatDate(year.pending_at))}
            ${modalInfoBox("Status", year.status || "UNKNOWN")}
            ${modalInfoBox("Final year price", `${money(year.final_year_price)} LBP`)}
            ${modalInfoBox("Estimated price", estimatedPrice)}
          </div>

          <div class="year-modal-section-head">
            <h3 class="year-modal-section-title">Numbers and balances</h3>
            <button id="copy-numbers-${escapeHtml(year.id)}" class="copy-numbers-button" type="button" onclick="copyYearNumbers('${escapeJsString(year.id)}')">
              Copy Numbers
            </button>
          </div>

          <div class="year-numbers-wrap">
            <table class="year-numbers-table">
              <thead>
                <tr>
                  <th>Number</th>
                  <th>Required Balance</th>
                  <th>Before</th>
                  <th>After</th>
                  <th>Received</th>
                </tr>
              </thead>
              <tbody>${numbersRows}</tbody>
            </table>
          </div>

          ${canCheck ? `
            <div class="year-modal-actions">
              <button id="check-${escapeHtml(year.id)}" class="year-button" type="button" onclick="checkYear('${escapeJsString(year.id)}')">
                Check
              </button>
            </div>
          ` : ""}

          ${canConfirm ? `
            <div class="year-modal-confirm">
              <label class="confirm-label">
                <input id="confirm-checkbox-${escapeHtml(year.id)}" type="checkbox" onchange="toggleConfirm('${escapeJsString(year.id)}')">
                <span>I am sure that I want to confirm this year and return the calculated amount to my wallet.</span>
              </label>
              <button id="confirm-${escapeHtml(year.id)}" class="year-button confirm" type="button" onclick="confirmYear('${escapeJsString(year.id)}')" disabled>
                Confirm Year
              </button>
            </div>
          ` : ""}

          ${messageHtml}
        </div>
      `;

      yearModalOverlay.classList.remove("hidden");
      yearModalOverlay.setAttribute("aria-hidden", "false");
      document.body.classList.add("year-modal-open");
    }

    async function copyYearNumbers(yearId) {
      const year = state.years.find((entry) => String(entry.id) === String(yearId));
      if (!year) return;

      const numbers = year.numbers
        .map((entry) => String(entry.numberphone ?? "").trim())
        .filter(Boolean);

      if (!numbers.length) return;

      const text = numbers.join("\n");
      const button = document.getElementById(`copy-numbers-${yearId}`);

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          textarea.remove();
        }

        if (button) {
          const oldText = button.textContent;
          button.textContent = "Copied";
          setTimeout(() => {
            if (button) button.textContent = oldText;
          }, 1200);
        }
      } catch (error) {
        console.error("copyYearNumbers error:", error);
      }
    }

    function showMessage(yearId, message, type = "info") {
      state.modalMessage = {
        yearId: String(yearId),
        text: String(message ?? ""),
        type,
      };

      const box = document.getElementById(`message-${yearId}`);
      if (!box) return;
      box.className = `year-message ${type}`;
      box.textContent = message;
    }
    function toggleConfirm(yearId) {
      const checkbox = document.getElementById(`confirm-checkbox-${yearId}`);
      const button = document.getElementById(`confirm-${yearId}`);
      if (button) button.disabled = !checkbox?.checked;
    }

    async function checkYear(yearId) {
      const year = state.years.find((entry) => String(entry.id) === String(yearId));
      const button = document.getElementById(`check-${yearId}`);
      if (!year || !button) return;
      const body = { year_id: year.id, year_name: year.year_name };
      if (year.source_group_id !== null) body.source_group_id = year.source_group_id;
      button.disabled = true;
      button.textContent = "Checking...";
      showMessage(yearId, "Checking year balances...", "info");
      try {
        const result = await apiRequest(API_PATHS.CHECK_YEAR, { method: "POST", body });
        showMessage(yearId, result.message || "Year checked successfully.", "success");
        await loadYears(false);
      } catch (error) {
        showMessage(yearId, error.message, "error");
        button.disabled = false;
        button.textContent = "Check";
      }
    }

    async function confirmYear(yearId) {
      const year = state.years.find((entry) => String(entry.id) === String(yearId));
      const checkbox = document.getElementById(`confirm-checkbox-${yearId}`);
      const button = document.getElementById(`confirm-${yearId}`);
      if (!year || year.status !== "CHECKING") return;
      if (!checkbox?.checked) {
        showMessage(yearId, "Tick the confirmation checkbox first.", "error");
        return;
      }
      if (!window.confirm("Are you sure you want to confirm this year? This action cannot be undone.")) return;
      button.disabled = true;
      button.textContent = "Confirming...";
      showMessage(yearId, "Confirming year and updating your wallet...", "info");
      try {
        const result = await apiRequest(API_PATHS.CONFIRM_YEAR, {
          method: "POST",
          body: { year_id: year.id, client_numberphone: year.client_numberphone },
        });
        showMessage(yearId, result.message || "Year confirmed successfully.", "success");
        await loadYears(false);
      } catch (error) {
        showMessage(yearId, error.message, "error");
        button.disabled = false;
        button.textContent = "Confirm Year";
      }
    }

    [searchInput, statusFilter, dateFrom, dateTo].forEach((element) => {
      element.addEventListener("input", renderYears);
      element.addEventListener("change", renderYears);
    });
    dateFilter.addEventListener("change", () => {
      customDates.classList.toggle("hidden", dateFilter.value !== "CUSTOM");
      renderYears();
    });
    document.getElementById("refreshButton").addEventListener("click", () => loadYears(false));

    yearModalOverlay.addEventListener("click", (event) => {
      if (event.target === yearModalOverlay) {
        closeYearDetails();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && state.openYearId !== null) {
        closeYearDetails();
      }
    });

    loadYears();
  </script>
  <script type="module" src="./firebase-notifications.js"></script>
  <script src="./theme.js"></script>
</body>
</html>
