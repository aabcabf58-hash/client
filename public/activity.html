<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Account Activity</title>
  <link rel="stylesheet" href="./site.css">
  <link rel="stylesheet" href="./theme.css">
  <style>
    :root {
      color-scheme: light;
      --bg: #dff5ff;
      --background: #dff5ff;
      --card: #ffffff;
      --card-soft: #eef9ff;
      --text: #17324a;
      --muted: #627d91;
      --border: #bddcec;
      --shadow: 0 12px 32px rgba(36, 105, 143, 0.10);
    }

    html,
    body {
      min-height: 100%;
      height: auto !important;
      overflow-x: hidden;
      overflow-y: auto !important;
    }

    body {
      margin: 0;
      background: var(--bg) !important;
      color: var(--text) !important;
    }

    .page {
      width: min(calc(100% - 32px), 1280px) !important;
      max-width: 1280px !important;
      min-height: 0 !important;
      height: auto !important;
      max-height: none !important;
      overflow: visible !important;
      margin: 0 auto !important;
      padding: 24px 0 48px !important;
      box-sizing: border-box;
    }

    .topbar {
      min-height: 84px;
      padding: 18px 20px !important;
    }

    .topbar h1 {
      font-size: clamp(24px, 3vw, 32px);
    }

    .navbar {
      min-height: 52px;
      padding: 6px !important;
      gap: 6px;
    }

    .nav-link {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    .topbar,
    .navbar,
    .panel,
    .activity-card,
    .activity-item,
    .summary-card,
    .filters {
      background: var(--card) !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
    }

    .nav-link.active,
    .filter-button.active {
      background: #dbeafe !important;
      color: #075985 !important;
    }

    .button:not(.secondary),
    .logout-button {
      background: #075985 !important;
      color: #fff !important;
      border-color: #075985 !important;
    }

    .button.secondary,
    .filter-button,
    .status,
    .badge,
    .message,
    .count {
      background: #e0f2fe !important;
      color: #075985 !important;
      border-color: var(--border) !important;
    }

    a,
    .nav-link {
      color: #0369a1 !important;
    }

    input,
    select,
    textarea,
    .search-input,
    .filter-input,
    .input {
      background: #f4fbff !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
    }

    main,
    section,
    .panel,
    .activity-list,
    .filters {
      max-height: none !important;
      overflow-y: visible !important;
    }

    .activity-balance-change {
      min-width: 190px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.5;
      white-space: nowrap;
    }

    .activity-balance-arrow {
      color: #38bdf8;
      font-size: 16px;
      font-weight: 900;
    }

    .activity-card.compact {
      display: block !important;
      min-height: 0 !important;
      padding: 0 !important;
      overflow: hidden;
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease;
    }

    .activity-card.compact:hover {
      transform: translateY(-2px);
      border-color: #38bdf8 !important;
    }

    .activity-summary {
      display: grid;
      grid-template-columns: minmax(115px, auto) minmax(110px, 1fr) auto;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
    }

    .activity-summary-money {
      display: grid;
      gap: 2px;
    }

    .activity-summary-target {
      min-width: 0;
      overflow: hidden;
      color: var(--text);
      font-size: 13px;
      font-weight: 900;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }

    .activity-summary-amount {
      font-size: 16px;
      font-weight: 900;
      white-space: nowrap;
      text-align: right;
    }

    .activity-summary-balance-line {
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    .activity-summary-date {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      text-align: right;
    }

    .activity-summary-amount.credit { color: #059669; }
    .activity-summary-amount.debit { color: #dc2626; }

    .activity-details {
      display: none;
      padding: 12px 14px 14px;
      border-top: 1px solid var(--border);
      background: var(--card-soft);
    }

    .activity-card.expanded .activity-details {
      display: block;
    }

    .activity-details-title {
      margin: 0 0 8px;
      font-size: 15px;
    }

    .activity-details .activity-meta {
      margin: 0;
    }

    .date-filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 12px 0 18px;
      padding: 12px;
      background: var(--card-soft);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .period-buttons {
      display: grid;
      grid-template-columns: repeat(3, minmax(56px, 1fr));
      gap: 6px;
      flex: 0 0 auto;
    }

    .period-buttons .filter-button {
      min-width: 0;
      padding: 8px 12px;
    }

    .date-picker {
      position: relative;
      flex: 0 0 auto;
    }

    .date-range-button {
      min-height: 40px;
      white-space: nowrap;
    }

    .date-calendar {
      position: absolute;
      z-index: 50;
      top: calc(100% + 8px);
      right: 0;
      width: min(340px, calc(100vw - 32px));
      padding: 14px;
      background: var(--card) !important;
      color: var(--text) !important;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      box-sizing: border-box;
    }

    .calendar-header,
    .calendar-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .calendar-header {
      margin-bottom: 12px;
    }

    .calendar-title {
      flex: 1;
      margin: 0;
      font-size: 15px;
      font-weight: 900;
      text-align: center;
    }

    .calendar-nav,
    .calendar-close {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #f4fbff;
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
    }

    .calendar-weekdays,
    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
      text-align: center;
    }

    .calendar-weekdays {
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .calendar-day,
    .calendar-empty {
      width: 100%;
      aspect-ratio: 1;
    }

    .calendar-day {
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }

    .calendar-day:hover:not(:disabled) {
      background: #e0f2fe;
    }

    .calendar-day.in-range {
      background: #dbeafe;
      border-radius: 0;
    }

    .calendar-day.range-start,
    .calendar-day.range-end {
      background: #075985;
      color: #fff;
      border-radius: 10px;
      font-weight: 900;
    }

    .calendar-day:disabled {
      color: #a9bac6;
      cursor: not-allowed;
    }

    .calendar-selection {
      min-height: 20px;
      margin: 10px 0 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    .calendar-actions .button {
      min-height: 38px;
    }

    .calendar-actions .button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    .date-filter-message {
      min-height: 18px;
      margin: -10px 0 10px;
      color: #dc2626;
      font-size: 12px;
      font-weight: 700;
    }

    @media (max-width: 640px) {
      .page {
        width: calc(100% - 12px) !important;
        padding: 5px 0 24px !important;
      }

      .topbar {
        min-height: 0;
        padding: 7px 10px !important;
        gap: 6px;
      }

      .topbar h1 {
        margin: 0;
        font-size: 18px;
        line-height: 1.15;
      }

      .topbar p {
        display: none;
      }

      .topbar-actions {
        gap: 5px;
      }

      .topbar-actions .button {
        min-height: 30px;
        padding: 5px 8px;
        font-size: 11px;
      }

      #page > .panel {
        padding: 8px !important;
      }

      .activity-summary {
        grid-template-columns: minmax(95px, auto) minmax(90px, 1fr) auto;
        gap: 8px 10px;
        padding: 9px 10px;
      }

      .activity-summary-target {
        text-align: center;
        font-size: 12px;
      }

      .activity-summary-amount {
        font-size: 14px;
      }

      .activity-summary-date {
        max-width: 90px;
        overflow: hidden;
        font-size: 9px;
        text-overflow: ellipsis;
      }

      .toolbar {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        margin-bottom: 6px;
      }

      .toolbar-group {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 4px;
        width: 100%;
      }

      .toolbar-group .filter-button,
      .period-buttons .filter-button {
        min-width: 0;
        min-height: 30px;
        padding: 5px 3px;
        font-size: 11px;
        line-height: 1;
        white-space: nowrap;
      }

      .search-input {
        min-height: 32px;
        padding: 6px 9px;
        font-size: 11px;
      }

      .date-filter-bar {
        align-items: center;
        flex-direction: row;
        gap: 5px;
        margin: 6px 0 8px;
        padding: 5px;
      }

      .period-buttons {
        width: auto;
        min-width: 0;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 3px;
        flex: 1 1 62%;
      }

      .date-picker {
        width: auto;
        min-width: 0;
        flex: 1 1 38%;
      }

      .date-range-button {
        width: 100%;
        min-height: 30px;
        padding: 5px 4px;
        overflow: hidden;
        font-size: 10px;
        text-overflow: ellipsis;
      }

      .date-filter-message {
        min-height: 0;
        margin: 0;
        font-size: 10px;
        line-height: 1.2;
      }

      .section-header {
        margin: 7px 0;
      }

      .section-header h2 {
        margin: 0;
        font-size: 16px;
      }

      .section-header .count {
        padding: 3px 7px;
        font-size: 10px;
      }

      .date-calendar {
        right: 0;
        left: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body class="activity-page">
  <div id="loading" class="loading">Loading activity...</div>

  <main id="page" class="page hidden">
    <header class="topbar">
      <div>
        <h1>Account Activity</h1>
        <p>Credits, debits, balances, and transaction status.</p>
      </div>

      <div class="topbar-actions">
        <a class="button secondary" href="./home.html" title="Home" aria-label="Home">🏠</a>
        <button id="refreshButton" class="button secondary" type="button">
          Refresh
        </button>
      </div>
    </header>

    <section class="panel" style="padding: 20px;">
      <div class="toolbar">
        <div class="toolbar-group">
          <button class="filter-button active" data-direction="ALL" type="button">
            All
          </button>
          <button class="filter-button" data-direction="CREDIT" type="button">
            Credit
          </button>
          <button class="filter-button" data-direction="DEBIT" type="button">
            Debit
          </button>
        </div>

        <input
          id="searchInput"
          class="search-input"
          type="search"
          placeholder="Search type, number, status..."
        >
      </div>

      <div class="date-filter-bar">
        <div class="period-buttons" aria-label="Activity period">
          <button class="filter-button active" data-period="1d" type="button">
            1D
          </button>
          <button class="filter-button" data-period="1w" type="button">
            1W
          </button>
          <button class="filter-button" data-period="1m" type="button">
            1M
          </button>
        </div>

        <div class="date-picker">
          <button
            id="dateRangeButton"
            class="button secondary date-range-button"
            type="button"
            aria-expanded="false"
            aria-controls="dateCalendar"
          >
            Dates
          </button>

          <div id="dateCalendar" class="date-calendar hidden">
            <div class="calendar-header">
              <button id="calendarPrevious" class="calendar-nav" type="button" aria-label="Previous month">‹</button>
              <h3 id="calendarTitle" class="calendar-title"></h3>
              <button id="calendarNext" class="calendar-nav" type="button" aria-label="Next month">›</button>
              <button id="calendarClose" class="calendar-close" type="button" aria-label="Close calendar">×</button>
            </div>

            <div class="calendar-weekdays" aria-hidden="true">
              <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
            </div>
            <div id="calendarDays" class="calendar-days"></div>
            <p id="calendarSelection" class="calendar-selection">Choose a start date, then an end date</p>

            <div class="calendar-actions">
              <button id="calendarClear" class="button secondary" type="button">Clear</button>
              <button id="calendarApply" class="button" type="button" disabled>Apply</button>
            </div>
          </div>
        </div>
      </div>

      <div id="dateFilterMessage" class="date-filter-message"></div>

      <div class="section-header">
        <h2>Transactions</h2>
        <span id="activityCount" class="count">0</span>
      </div>

      <div id="pageError" class="error-box hidden"></div>
      <div id="activityList" class="activity-list"></div>
    </section>
  </main>

  <script>
    const API_BASE_URL = "https://abdd-production.up.railway.app";

    const state = {
      activities: [],
      direction: "ALL",
      search: "",
      period: "1d",
      from: "",
      to: "",
    };

    const loading = document.getElementById("loading");
    const page = document.getElementById("page");
    const pageError = document.getElementById("pageError");
    const activityList = document.getElementById("activityList");
    const activityCount = document.getElementById("activityCount");
    const searchInput = document.getElementById("searchInput");
    const refreshButton = document.getElementById("refreshButton");
    const directionButtons = document.querySelectorAll("[data-direction]");
    const periodButtons = document.querySelectorAll("[data-period]");
    const dateRangeButton = document.getElementById("dateRangeButton");
    const dateCalendar = document.getElementById("dateCalendar");
    const calendarTitle = document.getElementById("calendarTitle");
    const calendarDays = document.getElementById("calendarDays");
    const calendarSelection = document.getElementById("calendarSelection");
    const calendarPrevious = document.getElementById("calendarPrevious");
    const calendarNext = document.getElementById("calendarNext");
    const calendarClose = document.getElementById("calendarClose");
    const calendarClear = document.getElementById("calendarClear");
    const calendarApply = document.getElementById("calendarApply");
    const dateFilterMessage = document.getElementById("dateFilterMessage");

    let draftFrom = "";
    let draftTo = "";
    let calendarMonth = null;

    function logout() {
      localStorage.removeItem("token");
      localStorage.removeItem("user");
      window.location.href = "./login.html";
    }

    function formatNumber(value) {
      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "0";
      }

      return new Intl.NumberFormat("en-GB", {
        maximumFractionDigits: 2,
      }).format(number);
    }

    function formatName(value) {
      return String(value ?? "")
        .replace(/_/g, " ")
        .trim();
    }

    function formatDate(value) {
      if (!value) {
        return "—";
      }

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return String(value);
      }

      return new Intl.DateTimeFormat("en-GB", {
        year: "numeric",
        month: "short",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      }).format(date);
    }

    async function getActivity() {
      const token = localStorage.getItem("token");

      if (!token) {
        logout();
        return [];
      }

      const query = new URLSearchParams();

      if (state.from && state.to) {
        query.set("from", state.from);
        query.set("to", state.to);
      } else {
        query.set("period", state.period);
      }

      const response = await fetch(
        `${API_BASE_URL}/auth/getActivity?${query.toString()}`,
        {
          method: "GET",
          headers: {
            Authorization: `Bearer ${token}`,
          },
        }
      );

      let result = {};

      try {
        result = await response.json();
      } catch (error) {
        console.error("Invalid JSON response:", error);
      }

      if (response.status === 401 || response.status === 403) {
        logout();
        return [];
      }

      if (!response.ok || result.success === false) {
        throw new Error(result.message || "Failed to get activity");
      }

      return Array.isArray(result.data) ? result.data : [];
    }

    function getFilteredActivities() {
      const search = state.search.toLowerCase();

      return state.activities.filter((activity) => {
        const direction = String(activity.direction || "").toUpperCase();

        if (
          state.direction !== "ALL" &&
          direction !== state.direction
        ) {
          return false;
        }

        if (!search) {
          return true;
        }

        const searchableText = [
          activity.id,
          activity.client_numberphone,
          activity.counterparty_numberphone,
          activity.activity_type,
          activity.currency,
          activity.status,
          activity.direction,
          activity.target_identifier,
          activity.item_name,
        ]
          .join(" ")
          .toLowerCase();

        return searchableText.includes(search);
      });
    }

    function createMeta(label, value) {
      const item = document.createElement("div");
      const strong = document.createElement("strong");

      strong.textContent = `${label}: `;
      item.appendChild(strong);
      item.appendChild(
        document.createTextNode(
          value === null || value === undefined || value === ""
            ? "—"
            : String(value)
        )
      );

      return item;
    }

    function formatDetailValue(value) {
      if (value === null || value === undefined || value === "") {
        return "—";
      }

      if (typeof value === "object") {
        try {
          return JSON.stringify(value);
        } catch (error) {
          return String(value);
        }
      }

      return String(value);
    }

    function renderActivities() {
      activityList.innerHTML = "";
      const activities = getFilteredActivities();
      activityCount.textContent = `${activities.length} activities`;

      if (activities.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No activity found";
        activityList.appendChild(empty);
        return;
      }

      for (const activity of activities) {
        const direction = String(activity.direction || "").toUpperCase();
        const status = String(activity.status || "").toUpperCase();
        const currency = String(activity.currency || "").toUpperCase();

        const card = document.createElement("article");
        card.className = "activity-card compact";
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.setAttribute("aria-expanded", "false");

        const summary = document.createElement("div");
        summary.className = "activity-summary";

        const targetIdentifier = document.createElement("div");
        targetIdentifier.className = "activity-summary-target";
        targetIdentifier.textContent =
          activity.target_identifier ||
          activity.counterparty_numberphone ||
          "—";

        const amount = document.createElement("div");
        amount.className =
          `activity-summary-amount ${direction === "CREDIT" ? "credit" : "debit"}`;
        amount.textContent =
          `${direction === "CREDIT" ? "+" : "-"}${formatNumber(
            Math.abs(Number(activity.amount) || 0)
          )}`;

        const balanceAfter = document.createElement("div");
        balanceAfter.className = "activity-summary-balance-line";
        balanceAfter.textContent =
          `After: ${formatNumber(activity.balance_after)}`;

        const balanceBefore = document.createElement("div");
        balanceBefore.className = "activity-summary-balance-line";
        balanceBefore.textContent =
          `Before: ${formatNumber(activity.balance_before)}`;

        const moneySummary = document.createElement("div");
        moneySummary.className = "activity-summary-money";
        moneySummary.appendChild(amount);
        moneySummary.appendChild(balanceAfter);
        moneySummary.appendChild(balanceBefore);

        const activityDate = document.createElement("div");
        activityDate.className = "activity-summary-date";
        activityDate.textContent = formatDate(activity.created_at);

        summary.appendChild(moneySummary);
        summary.appendChild(targetIdentifier);
        summary.appendChild(activityDate);

        const details = document.createElement("div");
        details.className = "activity-details";

        const title = document.createElement("h3");
        title.className = "activity-details-title";
        title.textContent =
          formatName(activity.activity_type) || "Activity";

        const statusBadge = document.createElement("span");
        statusBadge.className =
          `badge ${status === "COMPLETE" ? "success" : "pending"}`;
        statusBadge.textContent = status || "—";

        const meta = document.createElement("div");
        meta.className = "activity-meta";
        meta.appendChild(createMeta("Activity ID", activity.id));
        meta.appendChild(
          createMeta("Date", formatDate(activity.created_at))
        );
        meta.appendChild(createMeta("Currency", currency));
        meta.appendChild(createMeta("Status", status));
        meta.appendChild(createMeta("Direction", direction));
        meta.appendChild(createMeta("Item Name", activity.item_name));
        meta.appendChild(createMeta("Target", activity.target_identifier));
        meta.appendChild(createMeta("Order ID", activity.order_id));
        meta.appendChild(
          createMeta("Description", formatDetailValue(activity.description))
        );

        details.appendChild(title);
        details.appendChild(statusBadge);
        details.appendChild(meta);

        const toggleDetails = () => {
          const expanded = card.classList.toggle("expanded");
          card.setAttribute("aria-expanded", String(expanded));
        };

        card.addEventListener("click", toggleDetails);
        card.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            toggleDetails();
          }
        });

        card.appendChild(summary);
        card.appendChild(details);
        activityList.appendChild(card);
      }
    }

    async function loadActivity() {
      refreshButton.disabled = true;
      pageError.classList.add("hidden");

      try {
        state.activities = await getActivity();
        renderActivities();
        loading.classList.add("hidden");
        page.classList.remove("hidden");
      } catch (error) {
        console.error("Activity error:", error);
        loading.classList.add("hidden");
        page.classList.remove("hidden");
        pageError.textContent =
          error.message || "Unable to load activity";
        pageError.classList.remove("hidden");
      } finally {
        refreshButton.disabled = false;
      }
    }

    for (const button of directionButtons) {
      button.addEventListener("click", function () {
        state.direction = button.dataset.direction;

        for (const currentButton of directionButtons) {
          currentButton.classList.toggle(
            "active",
            currentButton === button
          );
        }

        renderActivities();
      });
    }

    function getBeirutToday() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Beirut",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
      }).formatToParts(new Date());

      const values = Object.fromEntries(
        parts
          .filter((part) => part.type !== "literal")
          .map((part) => [part.type, part.value])
      );

      return values.year + "-" + values.month + "-" + values.day;
    }

    function dateKeyToUtcDate(dateKey) {
      const [year, month, day] = dateKey.split("-").map(Number);
      return new Date(Date.UTC(year, month - 1, day));
    }

    function utcDateToKey(date) {
      return [
        date.getUTCFullYear(),
        String(date.getUTCMonth() + 1).padStart(2, "0"),
        String(date.getUTCDate()).padStart(2, "0"),
      ].join("-");
    }

    function formatDateKey(dateKey) {
      if (!dateKey) {
        return "";
      }

      return new Intl.DateTimeFormat("en-GB", {
        timeZone: "UTC",
        day: "2-digit",
        month: "short",
        year: "numeric",
      }).format(dateKeyToUtcDate(dateKey));
    }

    function syncPeriodButtons() {
      for (const button of periodButtons) {
        button.classList.toggle(
          "active",
          !state.from && button.dataset.period === state.period
        );
      }
    }

    function updateDateRangeButton() {
      if (state.from && state.to) {
        dateRangeButton.textContent =
          formatDateKey(state.from) + " – " + formatDateKey(state.to);
      } else {
        dateRangeButton.textContent = "Dates";
      }
    }

    function renderCalendar() {
      if (!calendarMonth) {
        return;
      }

      const year = calendarMonth.getUTCFullYear();
      const month = calendarMonth.getUTCMonth();
      const firstDay = new Date(Date.UTC(year, month, 1)).getUTCDay();
      const daysInMonth = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
      const today = getBeirutToday();
      const todayDate = dateKeyToUtcDate(today);

      calendarTitle.textContent = new Intl.DateTimeFormat("en-GB", {
        timeZone: "UTC",
        month: "long",
        year: "numeric",
      }).format(calendarMonth);

      calendarDays.innerHTML = "";

      for (let i = 0; i < firstDay; i += 1) {
        const empty = document.createElement("span");
        empty.className = "calendar-empty";
        calendarDays.appendChild(empty);
      }

      for (let day = 1; day <= daysInMonth; day += 1) {
        const date = new Date(Date.UTC(year, month, day));
        const dateKey = utcDateToKey(date);
        const button = document.createElement("button");
        button.type = "button";
        button.className = "calendar-day";
        button.textContent = String(day);
        button.setAttribute("aria-label", formatDateKey(dateKey));
        button.disabled = dateKey > today;

        if (draftFrom && draftTo && dateKey >= draftFrom && dateKey <= draftTo) {
          button.classList.add("in-range");
        }

        if (dateKey === draftFrom) {
          button.classList.add("range-start");
        }

        if (dateKey === draftTo) {
          button.classList.add("range-end");
        }

        button.addEventListener("click", function () {
          if (!draftFrom || draftTo || dateKey < draftFrom) {
            draftFrom = dateKey;
            draftTo = "";
          } else {
            draftTo = dateKey;
          }

          renderCalendar();
        });

        calendarDays.appendChild(button);
      }

      if (draftFrom && draftTo) {
        calendarSelection.textContent =
          formatDateKey(draftFrom) + " – " + formatDateKey(draftTo);
      } else if (draftFrom) {
        calendarSelection.textContent =
          "Start: " + formatDateKey(draftFrom) + " · Choose an end date";
      } else {
        calendarSelection.textContent = "Choose a start date, then an end date";
      }

      calendarApply.disabled = !(draftFrom && draftTo);
      calendarNext.disabled =
        year > todayDate.getUTCFullYear() ||
        (year === todayDate.getUTCFullYear() &&
          month >= todayDate.getUTCMonth());
    }

    function openCalendar() {
      draftFrom = state.from;
      draftTo = state.to;

      const initialDate = draftFrom || getBeirutToday();
      const parsedDate = dateKeyToUtcDate(initialDate);
      calendarMonth = new Date(
        Date.UTC(parsedDate.getUTCFullYear(), parsedDate.getUTCMonth(), 1)
      );

      dateCalendar.classList.remove("hidden");
      dateRangeButton.setAttribute("aria-expanded", "true");
      renderCalendar();
    }

    function closeCalendar() {
      dateCalendar.classList.add("hidden");
      dateRangeButton.setAttribute("aria-expanded", "false");
    }

    dateRangeButton.addEventListener("click", function () {
      if (dateCalendar.classList.contains("hidden")) {
        openCalendar();
      } else {
        closeCalendar();
      }
    });

    calendarPrevious.addEventListener("click", function () {
      calendarMonth.setUTCMonth(calendarMonth.getUTCMonth() - 1);
      renderCalendar();
    });

    calendarNext.addEventListener("click", function () {
      calendarMonth.setUTCMonth(calendarMonth.getUTCMonth() + 1);
      renderCalendar();
    });

    calendarClose.addEventListener("click", closeCalendar);

    calendarClear.addEventListener("click", async function () {
      draftFrom = "";
      draftTo = "";
      state.from = "";
      state.to = "";
      dateFilterMessage.textContent = "";
      updateDateRangeButton();
      syncPeriodButtons();
      closeCalendar();
      await loadActivity();
    });

    calendarApply.addEventListener("click", async function () {
      if (!draftFrom || !draftTo) {
        return;
      }

      state.from = draftFrom;
      state.to = draftTo;
      dateFilterMessage.textContent = "";
      updateDateRangeButton();
      syncPeriodButtons();
      closeCalendar();
      await loadActivity();
    });

    for (const button of periodButtons) {
      button.addEventListener("click", async function () {
        state.period = button.dataset.period;
        state.from = "";
        state.to = "";
        draftFrom = "";
        draftTo = "";
        dateFilterMessage.textContent = "";
        updateDateRangeButton();
        syncPeriodButtons();
        closeCalendar();
        await loadActivity();
      });
    }

    searchInput.addEventListener("input", function () {
      state.search = searchInput.value.trim();
      renderActivities();
    });

    refreshButton.addEventListener("click", loadActivity);
    updateDateRangeButton();
    syncPeriodButtons();
    loadActivity();
  </script>
  <script type="module" src="./firebase-notifications.js"></script>
  <script src="./theme.js"></script>
</body>
</html>
